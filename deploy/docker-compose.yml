# fusion-aigc-go 的服务编排（与 Java fusion-aigc 并行，独立 compose 项目）。
#
# 本文件在 deploy/ 下：所有路径相对于本文件；环境变量读 deploy/.env（compose 默认读同目录的 .env）。
#
# 依赖 Java 栈的中间件（同一台机器）：
#   · mysql / redis 来自 Java 栈的 fusion-internal 网络（外部网络，默认 fusion_fusion-internal）。
#     Java 栈先起（其 docker-compose.yml --profile middleware，或生产托管实例）。
#   · 库是 Java 的 fusion_aigc（共享），不是独立库。
#
# 本文件自己的：etcd（rpc 注册发现，2379 只绑回环）、6 个进程、mock（仅开发，COMPOSE_PROFILES=mock）。
#
# 起法（在 fusion-aigc-go 仓库根目录执行）：
#   cp deploy/.env.example deploy/.env                    # 按 Java 栈填口令与网络名
#   deploy/docker/render-etc.sh                           # 开发：渲染到 deploy/docker/etc
#   AIGC_ENV=prod deploy/docker/render-etc.sh             # 生产：渲染到 deploy/docker/etc-prod（先填 deploy/.env.prod）
#   docker compose -f deploy/docker-compose.yml up -d --build
#   本地联调加 COMPOSE_PROFILES=mock；生产不要开。
#
# 建表：先在 fusion_aigc 上执行 deploy/sql 下的 Go_V*.sql（容器不会替你跑 SQL，见 deploy/README.md 第 2 节）。
name: ${GO_PROJECT_NAME:-fusion-aigc-go}

x-svc: &svc
  restart: unless-stopped
  init: true
  environment:
    TZ: Asia/Shanghai
  volumes:
    # 渲染后的配置（只读）；本地文件存储目录共享给 gateway 与各 rpc（生产必须 Storage.Mode=oss）
    - ${AIGC_ETC_DIR:-./docker/etc}:/app/etc:ro
    - aigc_files:/app/data
  networks: [aigc, fusion-internal]
  depends_on:
    etcd:
      condition: service_started

services:
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.21}
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      # 只绑回环：宿主机上直接跑的开发进程用 127.0.0.1:2379 连
      - "127.0.0.1:2379:2379"
    volumes:
      - etcd_data:/etcd-data
    networks: [aigc]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  copywriting-rpc:
    <<: *svc
    build: { context: .., args: { PKG: ./app/copywriting/rpc, BIN: copywriting-rpc } }
    image: aigc/copywriting-rpc:local
    command: ["-f", "/app/etc/copywriting-rpc.yaml"]

  digitalhuman-rpc:
    <<: *svc
    build: { context: .., args: { PKG: ./app/digitalhuman/rpc, BIN: digitalhuman-rpc } }
    image: aigc/digitalhuman-rpc:local
    command: ["-f", "/app/etc/digitalhuman-rpc.yaml"]

  note-rpc:
    <<: *svc
    build: { context: .., args: { PKG: ./app/note/rpc, BIN: note-rpc } }
    image: aigc/note-rpc:local
    command: ["-f", "/app/etc/note-rpc.yaml"]

  imagegen-rpc:
    <<: *svc
    build: { context: .., args: { PKG: ./app/imagegen/rpc, BIN: imagegen-rpc } }
    image: aigc/imagegen-rpc:local
    command: ["-f", "/app/etc/imagegen-rpc.yaml"]

  gateway-api:
    <<: *svc
    build: { context: .., args: { PKG: ./app/gateway/api, BIN: gateway-api } }
    image: aigc/gateway-api:local
    command: ["-f", "/app/etc/gateway-api.yaml"]
    ports:
      - "${GATEWAY_PUBLISH_ADDR:-127.0.0.1}:${GATEWAY_PUBLISH_PORT:-18100}:8888"

  admin-api:
    <<: *svc
    build: { context: .., args: { PKG: ./app/admin/api, BIN: admin-api } }
    image: aigc/admin-api:local
    command: ["-f", "/app/etc/admin-api.yaml"]
    ports:
      - "${ADMIN_PUBLISH_ADDR:-127.0.0.1}:${ADMIN_PUBLISH_PORT:-18101}:8889"

  # ---- 以下仅开发联调（COMPOSE_PROFILES=mock），不要在生产启动 ----
  mock-aigc:
    <<: *svc
    profiles: [mock]
    build: { context: .., args: { PKG: ./tools/mocks/mock-aigc, BIN: mock-aigc } }
    image: aigc/mock-aigc:local
    command: ["-addr", ":5055"]
    depends_on: []

  mock-union:
    <<: *svc
    profiles: [mock]
    build: { context: .., args: { PKG: ./tools/mocks/mock-union, BIN: mock-union } }
    image: aigc/mock-union:local
    command: ["-addr", ":5056"]
    depends_on: []

  mock-linkparse:
    <<: *svc
    profiles: [mock]
    build: { context: .., args: { PKG: ./tools/mocks/mock-linkparse, BIN: mock-linkparse } }
    image: aigc/mock-linkparse:local
    command: ["-addr", ":5058"]
    depends_on: []

networks:
  aigc:
    driver: bridge
  # Java 栈的内部网络（外部，不由本项目创建）：mysql / redis 在这张网上
  fusion-internal:
    name: ${JAVA_INTERNAL_NETWORK:-fusion_fusion-internal}
    external: true

volumes:
  etcd_data:
  aigc_files:
