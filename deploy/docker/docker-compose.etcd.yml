# 本地开发（宿主机上 make run-all 直接跑服务）只需要 etcd：deploy/etc 的开发配置用它做 rpc 注册发现。
# 正式部署（docker-compose.yml）与一键脚本都是服务间直连，不需要 etcd。
#
#   docker compose -f deploy/docker/docker-compose.etcd.yml up -d
name: aigc-local-life-dev-etcd
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    ports: ["127.0.0.1:2379:2379"]
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
