# 媒体服务容器配置。Listen / Token 由环境变量注入；水印 logo 挂载到 /app/logo.png（不挂则水印接口返回 logo_unavailable）。
Listen: ${MEDIA_LISTEN}
# 与调用方（Java app.media-service.token、Go imagegen）保持一致；为空时服务拒绝启动
Token: ${MEDIA_SERVICE_TOKEN}
# 注册中心（r-nacos，Nacos 协议）：MEDIA_NACOS_SERVER_ADDR 留空则不注册（静态地址部署）；MEDIA_ADVERTISE_URL 是调用方访问本实例的地址（必须是 IP）。
# 开启 OpenAPI 鉴权时（RNACOS_ENABLE_OPEN_API_AUTH=true）必须给 Username/Password（与 r-nacos 初始化管理员账号一致），否则注册会被拒。
Registry:
  ServerAddr: ${MEDIA_NACOS_SERVER_ADDR}
  Namespace: ${MEDIA_NACOS_NAMESPACE}
  Group: DEFAULT_GROUP
  ServiceName: aigc-media
  Username: ${MEDIA_NACOS_USERNAME}
  Password: ${MEDIA_NACOS_PASSWORD}
  Advertise: ${MEDIA_ADVERTISE_URL}
FFmpeg: ffmpeg
FFprobe: ffprobe
# 水印 logo 路径：镜像默认 /app/logo.png（挂载提供）；为空则水印接口返回 logo_unavailable
LogoPath: ${MEDIA_LOGO_PATH}
MaxInputBytes: 209715200
MaxComposeInputs: 50
MaxConcurrent: 4
FetchTimeoutSeconds: 300
OpTimeoutSeconds: 900
# 线上必须为 false：开了就能让服务去访问内网地址（SSRF）。只有本地 e2e 才由 main.go 读 MEDIA_ALLOW_PRIVATE_HOSTS=true 打开
AllowPrivateHosts: false
