# 本地 / 联调：叠加在 docker-compose.yml 上，本地构建镜像（含 mock），并起 mock 执行面、联盟、链接解析。
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# .env 里设 AIGC_IMAGE=aigc-local-life:dev，执行面等地址指向本机 mock：
#   AIGC_ENDPOINT=http://127.0.0.1:5055  UNION_BASE_URL=http://127.0.0.1:5056  LINK_PARSE_URL=http://127.0.0.1:5058
# 正式环境的校验规则（token 鉴权、计费开启、会话共享……）在这里同样生效。
services:
  prepare:
    platform: linux/amd64   # 运行时镜像只支持 amd64（MySQL 官方客户端），Mac 上靠 Rosetta / 模拟构建
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        INCLUDE_MOCKS: "1"
        VERSION: dev

  # 反推 sidecar 本地构建（正式环境用 REVERSE_IMAGE 指定的预构建镜像）。联调默认指向 mock-reverse 时可不填 REVERSE_AIG_SECRET
  # （真 sidecar 需要真 ai-gateway：mock-aigateway 不登记 prompt-reverse 调用方，也不模拟 chat.completion；
  #  真网关上反推走模型组 vlm.deepseek-flash，环境变量见 docker-compose.yml 的 prompt-reverse）
  prompt-reverse:
    build:
      context: ../../tools/prompt-reverse
    image: ${REVERSE_IMAGE:-aigc-prompt-reverse:latest}

  mock-aigc:
    image: ${AIGC_IMAGE:?设置 AIGC_IMAGE}
    network_mode: host
    restart: unless-stopped
    command: ["/app/pkg/bin/mock-aigc", "-addr", "127.0.0.1:5055"]

  mock-union:
    image: ${AIGC_IMAGE:?设置 AIGC_IMAGE}
    network_mode: host
    restart: unless-stopped
    command: ["/app/pkg/bin/mock-union", "-addr", "127.0.0.1:5056"]

  mock-linkparse:
    image: ${AIGC_IMAGE:?设置 AIGC_IMAGE}
    network_mode: host
    restart: unless-stopped
    command: ["/app/pkg/bin/mock-linkparse", "-addr", "127.0.0.1:5058"]

  # studio 联调：mock 反推 sidecar（5057）与 mock ai-gateway（5059，密钥 MOCK_AIG_SECRET，默认 test-secret）。
  # .env 里设 REVERSE_SIDECAR_URL=http://127.0.0.1:5057  AI_GATEWAY_URL=http://127.0.0.1:5059  AI_GATEWAY_SECRET=test-secret
  mock-reverse:
    image: ${AIGC_IMAGE:?设置 AIGC_IMAGE}
    network_mode: host
    restart: unless-stopped
    environment:
      MOCK_REVERSE_FAIL: ${MOCK_REVERSE_FAIL:-}
    command: ["/app/pkg/bin/mock-reverse", "-addr", "127.0.0.1:5057"]

  mock-aigateway:
    image: ${AIGC_IMAGE:?设置 AIGC_IMAGE}
    network_mode: host
    restart: unless-stopped
    environment:
      MOCK_AIG_SECRET: ${AI_GATEWAY_SECRET:-test-secret}
    command: ["/app/pkg/bin/mock-aigateway", "-addr", "127.0.0.1:5059"]
