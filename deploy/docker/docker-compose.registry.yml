# aigc-local-life 正式部署（每服务独立镜像，从私有仓库拉取）
#
# 与 docker-compose.yml（单镜像）只有镜像来源不同，拓扑、prepare 流程、健康检查完全一致：
#   · 单镜像：6 个服务 + prepare 共用 ${AIGC_IMAGE}，构建/推送用主 Makefile 的 make image
#   · 本文件：每个服务用自己的镜像 <AIGC_REGISTRY>/aigc-local-life-<服务>:<AIGC_TAG>，
#             prepare 用 aigc-local-life-ops；构建/推送用 Makefile_x，发布由 webhook 触发
#
# AIGC_TAG 一次覆盖 6 个服务镜像与 ops 镜像（同一个 TAG 一起构建），回滚 = 换回上一个 TAG。
#
# 服务器上执行（目录建议 /opt/aigc-local-life）：
#   docker compose -f docker-compose.registry.yml pull          # 拉私有仓库的 7 个镜像
#   docker compose -f docker-compose.registry.yml up -d         # prepare 先跑完，6 个服务才启动
#   docker compose -f docker-compose.registry.yml logs -f prepare
#
# 网络：全部 host 网络，与 docker-compose.yml 相同——
#   · 服务只监听 127.0.0.1（网关 18888、后台 18889、rpc 19201–19204），公网只经宿主机 nginx；
#   · Redis 在宿主机（127.0.0.1:6379），MySQL 是阿里云 RDS（按内网地址连），Java 在 127.0.0.1:18080。
#
# 镜像自带启动命令 /app/<服务> -f /app/etc/<服务>.yaml（与服务名一一对应），这里不再重复写 command。
# 完整部署手册见 README.registry.md。
name: ${COMPOSE_PROJECT_NAME:-aigc-local-life}

x-svc: &svc
  network_mode: host
  # 宿主机 Redis 的域名映射。Linux 上没有 host.docker.internal 这个内置域名，
  # 配置里（Java REDIS_HOST / SESSION_REDIS_ADDR）写 host.docker.internal 时靠这条解析。
  # 注：host 网络下容器与宿主机共用网络栈，地址写 127.0.0.1:6379 同样能直连，两种写法都可用。
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  init: true
  environment:
    TZ: Asia/Shanghai
  volumes:
    - ./etc:/app/etc:ro
  depends_on:
    prepare:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        memory: ${AIGC_MEM_LIMIT:-1g}

x-rpc-health: &rpc-health
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

services:
  # 一次性准备：检查数据库 → 迁移（go_schema_history）→ 生成配置 → 渲染 nginx → 计费自检。
  # 任何一步失败都退出非 0，服务容器不会启动。逻辑与 install.sh、一键脚本部署完全一致。
  prepare:
    image: ${AIGC_REGISTRY:?设置 AIGC_REGISTRY：镜像仓库地址}/aigc-local-life-ops:${AIGC_TAG:?设置 AIGC_TAG：镜像版本}
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway" # 同 x-svc：会话 Redis 从宿主机 Java 的 REDIS_HOST 读，可能是容器服务名
    user: "0:0" # 需要把生成的配置交给服务用户（10001），并写备份
    restart: "no"
    env_file: [.env]
    environment:
      AIGC_CONTAINER: "1"
      INSTALL_DIR: /app
      JAVA_ENV_FILE: /run/java.env # 宿主机上 Java 的 .env 挂载到这里（.env 里的 JAVA_ENV_FILE 填宿主机路径）
    command: ["bash", "/app/pkg/install.sh", "prepare"]
    volumes:
      - ./etc:/app/etc
      - ./nginx:/app/nginx
      - ./backup:/app/backup
      - ${JAVA_ENV_FILE:-/dev/null}:/run/java.env:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  copywriting-rpc:
    <<: *svc
    image: ${AIGC_REGISTRY:?}/aigc-local-life-copywriting-rpc:${AIGC_TAG:?}
    healthcheck:
      <<: *rpc-health
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/${COPYWRITING_PORT:-19201}"]

  digitalhuman-rpc:
    <<: *svc
    image: ${AIGC_REGISTRY:?}/aigc-local-life-digitalhuman-rpc:${AIGC_TAG:?}
    healthcheck:
      <<: *rpc-health
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/${DIGITALHUMAN_PORT:-19202}"]

  note-rpc:
    <<: *svc
    image: ${AIGC_REGISTRY:?}/aigc-local-life-note-rpc:${AIGC_TAG:?}
    healthcheck:
      <<: *rpc-health
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/${NOTE_PORT:-19203}"]

  imagegen-rpc:
    <<: *svc
    image: ${AIGC_REGISTRY:?}/aigc-local-life-imagegen-rpc:${AIGC_TAG:?}
    healthcheck:
      <<: *rpc-health
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/${IMAGEGEN_PORT:-19204}"]

  # 网关与后台：未带令牌的请求返回 401 属正常，健康检查只要求进程能应答（1xx–4xx）
  gateway-api:
    <<: *svc
    image: ${AIGC_REGISTRY:?}/aigc-local-life-gateway-api:${AIGC_TAG:?}
    depends_on:
      prepare: { condition: service_completed_successfully }
      copywriting-rpc: { condition: service_healthy }
      digitalhuman-rpc: { condition: service_healthy }
      note-rpc: { condition: service_healthy }
      imagegen-rpc: { condition: service_healthy }
    healthcheck:
      <<: *rpc-health
      test: ["CMD-SHELL", "case $$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:${GATEWAY_PORT:-18888}/api/v1/local-life/copywriting/options) in [1-4]??) exit 0;; *) exit 1;; esac"]

  admin-api:
    <<: *svc
    image: ${AIGC_REGISTRY:?}/aigc-local-life-admin-api:${AIGC_TAG:?}
    depends_on:
      prepare: { condition: service_completed_successfully }
      copywriting-rpc: { condition: service_healthy }
      digitalhuman-rpc: { condition: service_healthy }
      note-rpc: { condition: service_healthy }
      imagegen-rpc: { condition: service_healthy }
    healthcheck:
      <<: *rpc-health
      test: ["CMD-SHELL", "case $$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:${ADMIN_PORT:-18889}/api/v1/local-life/admin/copywriting/model) in [1-4]??) exit 0;; *) exit 1;; esac"]