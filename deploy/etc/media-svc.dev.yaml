# 本地开发配置（go run ./app/media/cmd 的默认 -f，文件名带 .dev）。容器部署用 deploy/docker/media/media-svc.yaml（镜像内为 /app/etc/media-svc.yaml），不要混用。
#
# 敏感项不写在这里：Token 从环境变量 MEDIA_SERVICE_TOKEN 读取，未设置时服务拒绝启动。
#   export MEDIA_SERVICE_TOKEN=$(openssl rand -hex 32)
# 与调用方（Java app.media-service.token、Go imagegen）的 token 必须一致。
Listen: 127.0.0.1:18090
Token: ${MEDIA_SERVICE_TOKEN}
# 本地不注册到注册中心，调用方走静态地址（Java MEDIA_SERVICE_BASE_URLS / imagegen BaseURL）
Registry:
  ServerAddr: ""
# 水印 logo（PNG）：export MEDIA_LOGO_PATH=/path/to/logo.png；不设则水印接口返回 logo_unavailable
LogoPath: ${MEDIA_LOGO_PATH}
# 本机已装的 ffmpeg / ffprobe（在 PATH 里即可）
FFmpeg: ffmpeg
FFprobe: ffprobe
MaxInputBytes: 1073741824
StoreLocalMaxBytes: 2147483648
MaxComposeInputs: 50
# 名额三条通道（0 / 不写 = 按机器推导）；旧键 MaxConcurrent 仍可作 VideoCompute 的别名
VideoCompute: 2
LightCompute: 8
IO: 32
QueueWaitSeconds: 120
FetchTimeoutSeconds: 1800
OpTimeoutSeconds: 1800
# 仅本地联调可开；线上必须为 false
AllowPrivateHosts: false
# 本地单机开发用内存幂等存储（启动时会打印警告）；多实例 / 生产必须用 redis（见 deploy/docker/media/media-svc.yaml）
Idempotency:
  Store: memory
