Name: admin-api
Host: 0.0.0.0
Port: 8889
Mode: dev
Timeout: 60000   # 生成试听为同步合成
Log:
  Encoding: plain
Auth:
  Mode: dev             # dev：没带令牌时信任 X-Admin-Id（仅联调）；token：只认登录接口签发的令牌
  Jwt:
    Secret: local-dev-admin-secret-change-me   # 本地开发用；部署脚本会按环境生成随机值覆盖
    ExpireHours: 12     # 后台 12 小时，比 App 短
# 后台登录要读 afv_admin_user
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
# 连接池上限（可选，不写即用默认：MaxOpenConns=10，MaxIdleConns=min(open,10)，ConnMaxLifetimeSeconds=1800；全服务汇总见 docs/api/db-pool.md）
# DB:
#   MaxOpenConns: 10
CopywritingRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: copywriting.rpc}
  NonBlock: true
DigitalHumanRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: digitalhuman.rpc}
  Timeout: 60000        # 生成试听为同步合成
  NonBlock: true
NoteRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: note.rpc}
  NonBlock: true
ImageGenRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: imagegen.rpc}
  NonBlock: true
StudioRpc:              # studio 运营后台与 tyo/pse/simg 任务的重做、强制失败
  Etcd: {Hosts: [127.0.0.1:2379], Key: studio.rpc}
  Timeout: 10000        # 依赖探测每项 3s、重做要重新冻结点数，默认 2s 不够
  NonBlock: true
AssetLibRpc:            # 资产库后台（/api/v1/asset-library/admin）：标签字典、分类统计
  Etcd: {Hosts: [127.0.0.1:2379], Key: assetlib.rpc}
  NonBlock: true
CanvasRpc:              # 画布 / 提示词库后台（/api/v1/canvas/admin、/api/v1/prompt-library/admin）
  Etcd: {Hosts: [127.0.0.1:2379], Key: canvas.rpc}
  NonBlock: true
PlazaHeadline:          # 本周头条运营端（/api/v1/plaza/admin/headlines/**）；库用 DataSource，计数 Redis 复用 Auth.Session
  Jobs: false           # 头条后台任务（摄入 / 刷新 / 校准 / 清理）只在 admin-api 跑；上线时改 true（多副本靠行租约选主）

ReplicateAdmin:         # 视频做同款后台（/api/v1/replicate/admin/**）；库用 DataSource
  Billing:
    # 上线须与 gateway-api 的 Replicate.Billing.Mode 同为 "on"，否则人工退点 / 强制收尾返回 BILLING_OFF（避免把真实冻结的预留单误判为不计费）。
    # 加引号：YAML 1.1 会把裸 off / on 解析成布尔值，Mode 是字符串（off / shadow / on）。
    Mode: "off"
  TaskCenterEnabled: true # 强制收尾后触发任务中心同步；须与 gateway-api 的 Replicate.TaskCenterEnabled 一致
