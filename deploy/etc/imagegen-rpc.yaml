Name: imagegen.rpc
ListenOn: 0.0.0.0:9204
Mode: dev
# 90 秒：链接解析最慢会到 60 秒（对方降级路径），30 秒不够。
# 下载转存不在这条链路里（放后台了），所以不用给到分钟级。
Timeout: 90000
Etcd:
  Hosts: [127.0.0.1:2379]
  Key: imagegen.rpc
Log:
  Encoding: plain
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
# 计费：off 不计费 / shadow 只算价记日志、不拦用户 / on 真扣（服务器上由 deploy.env 的 BILLING_MODE 写入）
Billing:
  Mode: "off"
# AIGC 执行面（海报 78、长图 76、动作迁移 9、数字人口播 92）。正式地址待提供，本地先指向 mock-aigc
Aigc:
  Endpoint: http://127.0.0.1:5055   # 正式：http://<aigc_server>:5000
  TimeoutSeconds: 10
Storage:                # 须与网关一致
  Mode: local
  Prefix: aigc-life
  LocalDir: data/files
  LocalBaseUrl: http://127.0.0.1:8888/files
Asset:
  Enabled: true         # 成品写进素材库（分类见 V1.0.111 迁移）
Poster:
  Module: poster
  Slot: template
  Model: max            # 本版只用 max
  DefaultSize: "2:3"      # 产品 2026-09-24 定：海报可选比例，默认 2:3
  TemplateRequired: true
  AssetType: image          # 画廊「图片」tab 按 type=image 筛，细分靠 entry_code
  AssetEntryCode: poster
  TimeoutMinutes: 20
LongImage:
  Module: longImage
  Slot: template
  Model: ""             # 对接文档里 76 没有 model 参数，留空不传；AIGC 确认支持后再填
  DefaultSize: "1:3"      # 产品 2026-09-24 定：长图固定 1:3（执行面 76 的 size 选填，默认 1:4）
  TemplateRequired: true  # 最新对接文档：76 的 template_url 必填
  AssetType: image
  AssetEntryCode: longImage
  TimeoutMinutes: 20
TaskIDPrefix: AiCreationLife
Limits:
  MaxContentLen: 500
  MaxMaterials: 3       # 海报、长图都最多 3 张
  MaxImages: 4          # 生成数量上限
Poll:
  IntervalSeconds: 5
  TimeoutMinutes: 10
Moderation:
  Mode: keyword
ActionTransfer:
  Module: actionTransfer
  Slot: actionVideo     # 预置动作视频的投放位（模板素材表，type=video）
  Model: ""             # 默认模型档位；实际以前端传入为准（seedance 2.0 / lite）
  DefaultSize: ""       # 执行面 9 / 86 用自己的默认比例
  TemplateRequired: false
  AssetType: video
  AssetEntryCode: actionTransfer
  TimeoutMinutes: 40
Voiceover:              # 数字人口播（92；lite 路由到 91）
  Module: voiceover
  Slot: background      # 预设背景的投放位（模板素材表，type=image）
  DefaultSize: "9:16"
  TimeoutMinutes: 60    # 实测本地 GPU（92+lite）15 秒视频要 14 分钟；云端快一些；2026-10-11 执行面常态偏慢，放宽到 60
  Resolution: 720p      # 设计稿没有分辨率选项，固定 720p
  AssetType: video
  AssetEntryCode: voiceover
DigitalHumanRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: digitalhuman.rpc}
  NonBlock: true
CopywritingRpc:         # 取店铺档案拼好的文本
  Etcd: {Hosts: [127.0.0.1:2379], Key: copywriting.rpc}
  NonBlock: true
ExploreShop:            # 探店视频（72 出剧本 → 73 出片；缺省 model 走云端 81）
  DefaultModel: seedance2.5
  DefaultSize: "9:16"
  DefaultDuration: 15
  Resolution: 720p
  PlanTimeoutMinutes: 10
  GenTimeoutMinutes: 60
  AssetType: video
  AssetEntryCode: exploreShop
ShortDrama:             # 带货短剧（87 出剧本 → 88 出片；缺省 model 走云端 89）
  DefaultModel: seedance2.5
  DefaultSize: "9:16"
  DefaultDuration: 15
  Resolution: 720p
  PlanTimeoutMinutes: 10
  GenTimeoutMinutes: 60
  AssetType: video
  AssetEntryCode: shortDrama
VideoRemake:             # 爆款视频复刻（70 解析 → 71 复刻）
  MaxVideoBytes: 52428800   # 50M（设计稿：仅支持 3 分钟、50M 以内的视频）
  MaxVideoSeconds: 180      # 3 分钟；HEAD 拿不到时长，先卡体积，等 70 返回真实时长再判
  Formats: [mp4, avi, mkv, mov, flv, wmv]
  # 链接解析服务：分享链接/分享文案 → 直链 + 标题 + 封面（抖音/快手/小红书/B站，自动识别平台）。
  # BaseURL 留空 =「链接查视频」不开放，App 端只显示「上传视频」。
  # 他们要求超时不低于 60 秒（抖音 4–8s，降级路径更慢）。
  LinkParse:
    # 本地指向 mock-linkparse（make run-all 会启动）；服务器上由 deploy.env 的 LINK_PARSE_URL 覆盖
    BaseURL: "http://127.0.0.1:5058"
    TimeoutSeconds: 60
  ParseTimeoutMinutes: 30
  GenTimeoutMinutes: 180
  AssetType: video
  AssetEntryCode: videoRemake
VideoLimits:
  MaxUserTextLen: 500
  MaxSellingPointsLen: 500
