Name: imagegen.rpc
ListenOn: 0.0.0.0:9204
Mode: dev
Timeout: 30000
Etcd:
  Hosts: [127.0.0.1:2379]
  Key: imagegen.rpc
Log:
  Encoding: plain
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
# AIGC 执行面（海报 78、长图 76、动作迁移 9、数字人口播 92）。正式地址待提供，本地先指向 mock-aigc
Aigc:
  Endpoint: http://127.0.0.1:5055   # 正式：http://<aigc_server>:5000
  TimeoutSeconds: 10
Storage:                # 须与网关一致
  Mode: local
  Prefix: aigc-life
  LocalDir: data/files
  LocalBaseUrl: http://127.0.0.1:8888/files
Asset:
  Enabled: true         # 成品写进素材库（分类见 V1.0.111 迁移）
Poster:
  Module: poster
  Slot: template
  Model: max            # 本版只用 max
  DefaultSize: "9:16"
  TemplateRequired: true
  AssetType: poster
  AssetEntryCode: poster
  TimeoutMinutes: 20
LongImage:
  Module: longImage
  Slot: template
  Model: ""             # 对接文档里 76 没有 model 参数，留空不传；AIGC 确认支持后再填
  DefaultSize: "1:4"
  TemplateRequired: true  # 最新对接文档：76 的 template_url 必填
  AssetType: longImage
  AssetEntryCode: longImage
  TimeoutMinutes: 20
TaskIDPrefix: aigclife
Limits:
  MaxContentLen: 500
  MaxMaterials: 3       # 海报、长图都最多 3 张
  MaxImages: 4          # 生成数量上限
Poll:
  IntervalSeconds: 5
  TimeoutMinutes: 10
Moderation:
  Mode: keyword
ActionTransfer:
  Module: actionTransfer
  Slot: actionVideo     # 预置动作视频的投放位（模板素材表，type=video）
  Model: ""             # 默认模型档位；实际以前端传入为准（seedance 2.0 / lite）
  DefaultSize: ""       # 执行面 9 / 86 用自己的默认比例
  TemplateRequired: false
  AssetType: video
  AssetEntryCode: actionTransfer
  TimeoutMinutes: 40
Voiceover:              # 数字人口播（92；lite 路由到 91）
  Module: voiceover
  Slot: background      # 预设背景的投放位（模板素材表，type=image）
  DefaultSize: "9:16"
  TimeoutMinutes: 40    # 实测本地 GPU（92+lite）15 秒视频要 14 分钟；云端快一些
  Resolution: 720p      # 设计稿没有分辨率选项，固定 720p
  AssetType: video
  AssetEntryCode: voiceover
DigitalHumanRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: digitalhuman.rpc}
  NonBlock: true
CopywritingRpc:         # 取店铺档案拼好的文本
  Etcd: {Hosts: [127.0.0.1:2379], Key: copywriting.rpc}
  NonBlock: true
ExploreShop:            # 探店视频（72 出剧本 → 73 出片；缺省 model 走云端 81）
  DefaultModel: seedance2.5
  DefaultSize: "9:16"
  DefaultDuration: 15
  Resolution: 720p
  PlanTimeoutMinutes: 10
  GenTimeoutMinutes: 40
  AssetType: video
  AssetEntryCode: exploreShop
ShortDrama:             # 带货短剧（87 出剧本 → 88 出片；缺省 model 走云端 89）
  DefaultModel: seedance2.5
  DefaultSize: "9:16"
  DefaultDuration: 15
  Resolution: 720p
  PlanTimeoutMinutes: 10
  GenTimeoutMinutes: 40
  AssetType: video
  AssetEntryCode: shortDrama
VideoRemake:             # 爆款视频复刻（70 解析 → 71 复刻）
  MaxVideoBytes: 52428800   # 50M（设计稿：仅支持 3 分钟、50M 以内的视频）
  MaxVideoSeconds: 180      # 3 分钟；HEAD 拿不到时长，先卡体积，等 70 返回真实时长再判
  Formats: [mp4, avi, mkv, mov, flv, wmv]
  LinkResolver: ""          # 链接解析服务地址；留空 =「链接查视频」暂不开放，只能上传视频
  ParseTimeoutMinutes: 15
  GenTimeoutMinutes: 40
  AssetType: video
  AssetEntryCode: videoRemake
VideoLimits:
  MaxUserTextLen: 500
  MaxSellingPointsLen: 500
