Name: gateway-api
Host: 0.0.0.0
Port: 8888
# go-zero 收到 SIGTERM 后的强杀时间（默认 5.5s）。视频做同款后台调度器停机最长 = Replicate.StopGraceMs(4s) + 释放租约 / 认领 1s + 等 worker 1s + 兜底释放 0.5s ≈ 6.5s，
# 须小于它，否则租约放不掉、要等 LeaseSeconds 过期才能被其它实例接手（docs/api/api-replicate.md §5.2）。
Shutdown:
  WaitTime: 10s
Mode: dev
Timeout: 60000
MaxBytes: 11534336   # 请求体上限 11MB（上传照片 10MB）
Log:
  Encoding: plain
Auth:
  Mode: dev             # dev：没带令牌时信任 X-User-Id（仅联调）；token：只认我们签发的令牌
  Jwt:
    Secret: local-dev-secret-change-me   # 本地开发用；部署脚本会按环境生成随机值覆盖
    ExpireHours: 168    # 7 天（仅在没配 Session 时用）
  # Session：和 AIGC（Java）服务共用的 Redis 会话——一个 token 两边都认。
  # 配了就发它那套 token，没配回落到上面的 Jwt。本地指向自带的 redis-7 容器。
  Session:
    RedisAddr: "127.0.0.1:6379"
    RedisDB: 10         # 必须和 AIGC 服务一致（它容器里的 REDIS_DB=10），填错就是「写进去了它读不到」
    AccessHours: 2
    RefreshDays: 7
    MaxSessions: 0      # 0 = 不限，和它的 max-concurrent-sessions 一致
Union:                  # 联盟（xxlm）用户服务：登录时用前端给的临时 token 换用户信息
  BaseURL: http://127.0.0.1:5056   # 本地指向 mock-union（make run-all 会启动）；线上填 https://agent.pengqiwl.com
  TimeoutSeconds: 10
# 建档交给现有 Java 服务（可选）。配了这三样就由它的 /api/v1/union/user-register 建，
# 没配就本服务自己写表。本地想试这条路：bash tests/e2e/e2e-login-fusion.sh
# Fusion:
#   BaseURL: http://127.0.0.1:5057
#   AppKey: "12345678910"
#   AppSecret: mock-secret
CopywritingRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: copywriting.rpc}
  Timeout: 60000
  NonBlock: true
DigitalHumanRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: digitalhuman.rpc}
  Timeout: 60000
  NonBlock: true
NoteRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: note.rpc}
  Timeout: 30000
  NonBlock: true
# 仅 Storage.Mode=oss 时需要（读 afv_system_config 的公有桶配置）
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
# 连接池上限（不写即用 pkg/dbpool 默认 MaxOpenConns=40，MaxIdleConns=min(open,10)，ConnMaxLifetimeSeconds=1800；全服务汇总见 docs/api/db-pool.md）。
# 视频做同款调度器默认 32 个 worker + 余量 15 = 47，这里显式给 48；不配的话调度器会按比例压到约 25 个 worker 并告警。
DB:
  MaxOpenConns: 48
Storage:                # 须与 digitalhuman-rpc 一致
  Mode: local
  Prefix: aigc-local-life
  LocalDir: data/files
  LocalBaseUrl: http://127.0.0.1:8888/files
Upload:
  MaxImageBytes: 10485760   # 仅网关代传（开发用）生效；直传的大小与类型由前端控制
ImageGenRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: imagegen.rpc}
  # 90 秒：提交链接复刻时要同步等链接解析（对方降级路径最慢 60 秒）
  Timeout: 90000
  NonBlock: true
StudioRpc:              # 商拍换装 / 姿态复刻 / 图片生成（/api/v1/studio）
  Etcd: {Hosts: [127.0.0.1:2379], Key: studio.rpc}
  Timeout: 30000
  NonBlock: true
Studio:                 # 工作室接口的网关侧限制
  PosePreviewPerMinute: 6   # 姿态配对预览每用户每分钟次数上限（超出 4002「识别太频繁，请稍后再试」；<=0 不限）
  PosePreviewPerDay: 200    # 每用户每天（北京时间自然日）上限；计数在 Auth.Session 的 Redis，多实例共享
  MaskPerMinute: 30         # 区域蒙版（POST /api/v1/studio/masks）每用户每分钟上限（超出 4002「识别太频繁，请稍后再试」；<=0 不限）
  MaskPerDay: 500           # 每用户每天上限；计数同上
  DetailsPerMinute: 6       # 商拍「AI 找细节」（POST /api/v1/studio/tryon/details）每用户每分钟上限（超出 4002；<=0 不限）
  DetailsPerDay: 200        # 每用户每天上限；计数同上
  ColorFixAutoPerMinute: 6  # 参考图自动校色（POST /api/v1/studio/colorfix/auto）每用户每分钟上限（超出 4002 · COLORFIX_AUTO_TOO_FREQUENT；<=0 不限）
  ColorFixAutoPerDay: 200   # 每用户每天上限；计数同上
CanvasAgent:            # 画布智能体工具（MCP：POST /api/v1/canvas/mcp；Function Call：GET /api/v1/canvas/agent/tools、POST /api/v1/canvas/agent/call）
  Enabled: true
  CallsPerMinute: 120     # 每用户工具调用次数上限（计数在 Auth.Session 的 Redis；<=0 不限）
  CallsPerDay: 5000
  GeneratePerMinute: 10   # 每用户生成类调用（canvas_run_node）上限，另计入上面的总数
  GeneratePerDay: 300
  McpTokenCallsPerMinute: 60     # 每个 mcp_ 访问令牌独立的每分钟调用上限（在按用户限速之外；<=0 不限）
  McpTokenGeneratePerMinute: 10  # 每个 mcp_ 访问令牌独立的每分钟生成上限（另计入上面的总数）
  AllowedOrigins: []      # MCP 接受的浏览器 Origin；空 = 只接受不带 Origin 的服务端 / 桌面客户端
AssetLibRpc:            # 资产库增强（/api/v1/asset-library）
  Etcd: {Hosts: [127.0.0.1:2379], Key: assetlib.rpc}
  Timeout: 10000
CanvasRpc:              # 画布 + 提示词库（/api/v1/canvas、/api/v1/prompt-library）
  Etcd: {Hosts: [127.0.0.1:2379], Key: canvas.rpc}
  Timeout: 60000        # 执行节点内联提交（拉入参考图 / 提交 gateway·Java·studio / 裁剪同步完成）
  NonBlock: true
Replicate:              # 视频做同款（/api/v1/replicate/**，docs/api/api-replicate.md）；默认关，运行参数见 afv_system_config 的 replicate.*
  Enabled: false        # 总开关默认值：afv_system_config.replicate.enabled 存在时以库为准（数据库 > 文件配置）；关着只拦新提交，读接口 / 轮询器照常
  Billing: {Mode: "off"} # off / shadow / on（加引号：YAML 里裸 off 是布尔）
  # 后台调度器（CONTRACT §AC）：job / 分析 / 入素材库三条车道各自有界并发、持续补位、互不阻塞；库里 replicate.engine.concurrency /
  # analysis_concurrency / delivery_concurrency 覆盖（60 秒内生效）。三者合计须 ≤ DB.MaxOpenConns − 15（HTTP 8 + 后台取数 / 批量查 / 心跳 7），
  # 超了运行时按比例压低并告警（判据=ENGINE_DB_POOL_CAP），见 docs/api/db-pool.md。
  # PollIntervalMs 无积压时的取数间隔；BatchSize 每次取到期行上限（0 = 车道并发 × 2）。
  StopGraceMs: 4000     # 停机时等在途 worker 做完的时长；到点取消并统一释放租约 / 认领。与上面 Shutdown.WaitTime 一起调
  EngineConcurrency: 16
  AnalysisConcurrency: 8
  DeliveryConcurrency: 8
  PollIntervalMs: 2000
  BatchSize: 0
  AiGateway: {BaseURL: "", KeyID: "", Secret: ""}
  Media: {BaseURL: "", Token: ""}
  Preview: {Enabled: true, ModelGroup: "img.gpt-image-2.5-sunburst", DailyQuota: 3, WaitSeconds: 60} # 定妆图（免费，agent 工具 replicate_preview_frame）：image.edit 模型组 / 每人每自然日（Asia/Shanghai）次数 / 等出图上限
  Motion: {Enabled: true} # 接缝挪到画面最静处：分析多段视频时向媒体服务要运动量曲线（video/motion-profile），算不出自动退回均分
  Voice: {Enabled: true, ModelGroup: "tts.minimax-speech-2.8-hd", DailyQuota: 10, WaitSeconds: 60, Concurrency: 4} # 换声音 / 改台词（免费，每人每天条数；音色目录复用数字人音色表，参数值须属于该 tts 模型组）
  Trending: {MinUsers: 20} # 灵感推荐 k-匿名阈值（近 7 天已确认方案，某改法组合的去重用户数低于它不展示；运行时 replicate.trending.min_users 覆盖）
CanvasInternal:         # 服务间内部入口（Java 画布助手 → /internal/v1/canvas/agent/*，签名契约 docs/design/canvas-agent-tools.md §12）；Keys 为空则不注册
  Keys: []              # 例：[{KeyId: "fusion-java", Secret: "<≥32 字节随机串，与 Java APP_FUSION_GO_SECRET 相同>"}]；轮换时新旧并存。nginx 须对公网屏蔽 /internal/
CanvasEvents:           # 画布实时同步 SSE（/api/v1/canvas/canvases/:id/events），订阅 Auth.Session 的 Redis
  MaxConnsPerUser: 5
