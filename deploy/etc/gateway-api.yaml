Name: gateway-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 60000
MaxBytes: 11534336   # 请求体上限 11MB（上传照片 10MB）
Log:
  Encoding: plain
Auth:
  Mode: dev
CopywritingRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: copywriting.rpc}
  Timeout: 60000
  NonBlock: true
DigitalHumanRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: digitalhuman.rpc}
  Timeout: 60000
  NonBlock: true
NoteRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: note.rpc}
  Timeout: 30000
  NonBlock: true
# 仅 Storage.Mode=oss 时需要（读 afv_system_config 的公有桶配置）
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
Storage:                # 须与 digitalhuman-rpc 一致
  Mode: local
  Prefix: aigc-life
  LocalDir: data/files
  LocalBaseUrl: http://127.0.0.1:8888/files
Upload:
  MaxImageBytes: 10485760
ImageGenRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: imagegen.rpc}
  NonBlock: true
