Name: studio.rpc
ListenOn: 0.0.0.0:9205
Mode: dev
Timeout: 30000
# 单独放宽的方法超时：姿态配对预览要读原图 + 每张姿势图（单次读图 60–140s）。不配时代码按 240s 补上
MethodTimeouts:
  - FullMethod: /studio.Studio/PreviewPose
    Timeout: 240s
  # 商拍「AI 找细节」：下载服装图 + 一次 crop-plan（单次读图可达 180s）。不配时代码按 240s 补上
  - FullMethod: /studio.Studio/DetectDetails
    Timeout: 240s
Etcd:
  Hosts: [127.0.0.1:2379]
  Key: studio.rpc
Log:
  Encoding: plain
# 现有系统库；OSS 配置从库里读，不写在这里
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
# 计费：off 不计费 / shadow 只算价记日志、不拦用户 / on 真扣（服务器上由 deploy.env 的 BILLING_MODE 写入）
Billing:
  Mode: "off"
Storage:                # 须与网关一致
  Mode: local
  Prefix: aigc-local-life
  LocalDir: data/files
  LocalBaseUrl: http://127.0.0.1:8888/files
# 素材库：成品每张图一行，入口码按 kind 取 EntryCodes（分类见 Go_V1.0.21）
Asset:
  Enabled: true
  Type: image
EntryCodes:
  Tryon: studio_tryon
  Pose: studio_pose
  ImageGen: studio_imagegen
# 子任务号 / 任务中心坐标前缀：只能字母数字，不含下划线；img 已被海报/长图占用，图片生成用 simg
TaskIDPrefix:
  Tryon: tyo
  Pose: pse
  ImageGen: simg
Poll:
  IntervalSeconds: 5
  Concurrency: 3        # 每批次同时生图数（s1.1 验收口径）
  BatchConcurrency: 2   # 同时编排（下载 / 切图 / 反推）的批次数
  Workers: 16           # 同时长轮询 gateway 的子任务数
  BatchSize: 100
Moderation:
  Mode: keyword         # 与 AI文案共用 BLOCKWORD 词库
# ai-gateway：调用方 fusion-go（ai-gateway 部署时加 AIG_CALLER_KEYS）。BaseURL 留空 = 提交返回「暂未开放」。
# 服务器上由 deploy.env 的 AI_GATEWAY_URL / AI_GATEWAY_KEY_ID / AI_GATEWAY_SECRET 写入
AiGateway:
  BaseURL: ""
  KeyID: fusion-go-v1
  Secret: ""
  LongPollWait: 20
  TimeoutSeconds: 30
  MaxCostCNY: "5.00"    # 每次生图调用的供应商成本上限（人民币，网关软上限）
# 图片生成 rewrite_prompt=true 时的润色模型组（gateway chat.completion）；失败按原提示词继续
Rewrite:
  ModelGroup: llm.deepseek-flash          # 无参考图（DeepSeek Flash：官方 tier 0、百炼 tier 1）
  VisionModelGroup: vlm.qwen-3.8-flash    # 有参考图（llm.* 不收图）
# 反推 sidecar（Python，只监听内网）。服务器上由 deploy.env 的 REVERSE_SIDECAR_URL 覆盖
Reverse:
  BaseURL: http://127.0.0.1:8090
  Timeout: 200          # 秒，单次 HTTP（sidecar 读图单次最长 180s）
  Concurrency: 6
  PreviewConcurrency: 2 # 姿态配对预览（免费）最多同时占用的 sidecar 名额，付费编排至少留 Concurrency-2 个
# 共享媒体服务（下载 / 压缩 / 裁图 / 组图 / 产物转存）。NacosServerAddr 配了就订阅实例，BaseURL 只作回退
Media:
  NacosServerAddr: 127.0.0.1:8848
  NacosGroup: DEFAULT_GROUP
  NacosServiceName: aigc-media
  BaseURL: http://127.0.0.1:18090
  Token: change-me
# 前端模型档 → ai-gateway model group；「通用」= 运营定的默认组
# 具名档（2026-11-09 换代）：GPT Image 2.6 / Nano Banana 2.1 / Seedream 5.5；「通用」= GPT Image 2.5（按张计费，1K / 2K / 4K）
# 组码一律写规范组，厂商部署由网关挑（应用侧不区分 Dev 档）。旧值（*-dev / *-developer 组码、GPT25Dev 键）仍可读，自动归一。
ModelGroups:
  通用: img.gpt-image-2.5-sunburst
  GPT: img.gpt-image-2.6-sunburst
  Banana: img.nano-banana-2.1
  Seedream: img.seedream-5.5
  # GPT Image 2.5：按张计费，1K / 2K / 4K
  GPT25: img.gpt-image-2.5-sunburst
Timeouts:
  Crop: 120
  Analyze: 120
  Generate: 300
# 商拍反推提示词灰度：Seedream 批次按批次号哈希，命中 NewPercent% 走 prompt_version=new（Nano 等一律稳定版）。
# 0 = 关闭。运行时可用 afv_system_config.studio_tryon_new_prompt_percent（0–100）覆盖，60s 内生效
TryonPrompt:
  NewPercent: 0
Limits:
  MaxPromptLen: 3000
# 免费档图片的读时参数水印（与 Java app.free-watermark 同一语义，默认关）。开启且 Process 合法时，免费档用户
# （afv_points_batch 没有 RECHARGE / UNION_RECHARGE 批次，且 user_tier.enabled / watermark.display_enabled 开）的成品原件留私有桶，
# result_url 与素材库写 mrw://{rid}.{ext}，每次读签成带 x-oss-process 水印参数的地址。Process 必须与 Java
# （启动日志 check=free_watermark.process）、assetlib FreeWatermark.Process 三处相同；服务器上由 deploy.env 的
# FREE_WATERMARK_ENABLED / FREE_WATERMARK_OSS_PROCESS 写入。关掉后新任务照旧转存公有桶，已落库的 mrw:// 仍按 Process 签水印地址
FreeWatermark:
  Enabled: false
  Process: ""
  SignedTTLSeconds: 600   # 水印地址签名有效期（秒）
  UserTierDefault: true          # afv_system_config 无 user_tier.enabled 时的默认（= Java USER_TIER_ENABLED）
  DisplayWatermarkDefault: true  # afv_system_config 无 watermark.display_enabled 时的默认（= Java WATERMARK_ENABLED）
  PromoteMinutes: 10      # 付费转存扫描间隔（分钟），<=0 关闭
  CleanupEnabled: false   # 到期清理（= Java free-original.cleanup-enabled）：未付费超保留期的水印原件 / 素材库行 / 子任务删除
  RetentionDays: 90       # 保留天数（从子任务结束时间算，= Java retention-days）
  CleanupMinutes: 60      # 到期清理扫描间隔（分钟），<=0 关闭
