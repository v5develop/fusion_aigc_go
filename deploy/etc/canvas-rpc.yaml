Name: canvas.rpc
ListenOn: 0.0.0.0:9207
Mode: dev
Timeout: 60000          # RunNode 内联提交（拉入参考图 + 提交 gateway / Java / studio、裁剪同步完成）
Etcd:
  Hosts: [127.0.0.1:2379]
  Key: canvas.rpc
Log:
  Encoding: plain
# 现有系统库（afv_canvas* 新表 + 计费 / 任务中心 / 素材库共享表）
DataSource: root:123456@tcp(127.0.0.1:3306)/fusion_aigc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27
# 连接池上限（可选，不写即用默认：MaxOpenConns=30，MaxIdleConns=min(open,10)，ConnMaxLifetimeSeconds=1800；全服务汇总见 docs/api/db-pool.md）
# DB:
#   MaxOpenConns: 30
# 计费：off / shadow / on（服务器上由 deploy.env 的 BILLING_MODE 写入）。只有 image / video / i2p 由 Go 计费
Billing:
  Mode: "off"
Storage:
  Mode: local
  Prefix: aigc-local-life
  LocalDir: data/files
  LocalBaseUrl: http://127.0.0.1:8888/files
# 免费档水印视图（studio 试穿成品 mrw://）读时签名：Process 必须与 studio / assetlib / Java 相同；留空则水印视图输出为空（绝不签干净原件）
FreeWatermark:
  Process: ""
  SignedTTLSeconds: 600
# 素材库：gateway 生成的图 / 视频与裁剪图每个候选一行（Java 工具与 studio 试穿的成品由对方入库）
Asset:
  Enabled: true
  Type: image
EntryCodes:
  Image: canvas_image
  Video: canvas_video
  Crop: canvas_tool_crop
  I2P: canvas_tool_i2p
TaskIDPrefix: cv
# ai-gateway（调用方 fusion-go）。服务器上由 deploy.env 的 AI_GATEWAY_URL / AI_GATEWAY_KEY_ID / AI_GATEWAY_SECRET 写入
AiGateway:
  BaseURL: ""
  KeyID: fusion-go-v1
  Secret: ""
  LongPollWait: 20       # 运行中 gateway run 的长轮询每次挂起秒数（1–60）：完成检测主路径，出图后约 0–1 秒内收尾
  TimeoutSeconds: 30     # 单次 HTTP 超时（不含长轮询等待）
# 共享媒体服务：参考图拉入成 mr://、裁剪、产物转存素材库桶。NacosServerAddr 配了就订阅实例，BaseURL 只作回退
Media:
  NacosServerAddr: 127.0.0.1:8848
  NacosGroup: DEFAULT_GROUP
  NacosServiceName: aigc-media
  BaseURL: http://127.0.0.1:18090
  Token: change-me
# Java 主项目内网地址（creaft v1 兼容工具 / 任务查询 / 价目，透传用户 Bearer）。服务器上由 deploy.env 的 CANVAS_JAVA_BASE_URL 写入
Java:
  BaseURL: ""
  Timeout: 30
# 试穿走 studio-rpc
StudioRpc:
  Etcd: {Hosts: [127.0.0.1:2379], Key: studio.rpc}
  NonBlock: true
I2P:
  ModelGroup: vlm.qwen-3.8-flash   # 必须带视觉（gateway 审计：llm.* 传图会 no_capable_deployment）
  MaxTokens: 1200
FrameModelGroup: vid.seedance-2     # 带首尾帧时改用（seedance-2.5 不支持首尾帧）
MaxCostCNY:
  Image: "5.00"
  Video: "60.00"
  I2P: "1.00"
Poll:
  IntervalSeconds: 3     # 兜底扫描间隔（排队重提 / Java / studio / 长轮询没接住的 gateway run）；gateway 完成检测走长轮询，不靠它
  BatchSize: 100
  MaxSubmitAttempts: 5
  Watchers: 64           # 同时长轮询 gateway 的 run 数（全进程）；满了新 run 由兜底扫描 batchGet，慢一个扫描间隔
  LookupConcurrency: 8   # 兜底扫描里 Java 任务 / studio 批次查询的并发度
  FanoutConcurrency: 4   # 单个 run 内：参考图拉入、N 张网关提交、N 张产物转存素材库的并发度
Library:
  AsyncCopy: true        # 产物先以私有引用 mr:// 置成功、结算、对用户可见，转存素材库在后台（outbox afv_canvas_copy_job，Go_V1.0.29）；false 回到同步转存
  Workers: 8             # 本进程同时执行的转存任务数
  MaxAttempts: 10        # 超过记永久失败（产物仍可看可下载，library_status=failed，告警 check=canvas.library_copy_failed）
  ClaimSeconds: 300      # 认领一轮的时长，执行方崩溃后最多这么久由扫描接手
  SweepBatch: 50
Timeouts:
  Image: 300             # 软时限（从 run 创建算起，含提交阶段）：到点时没有调用被供应商受理 → 失败退款并取消
  Video: 900
  Tool: 600
  I2P: 180
  ImageHardCap: 900      # 硬上限：已被供应商受理（受理后取消也照样扣费）的调用不取消、最多等到这里；须小于 Billing.Hold（启动自检）
  VideoHardCap: 1800
  I2PHardCap: 600
Limits:
  MaxSnapshotBytes: 2097152
  MaxNodes: 2000
  MaxPromptLen: 3000
  MaxPromptsPerUser: 500
  MaxTitleLen: 100
