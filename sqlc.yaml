# sqlc 配置：只服务计费 / 对账 / 定点审计的只读查询（设计方案 §9.5）。
# 生成命令见 Makefile 的 gen-audit；产物在 pkg/auditdb，不要手改生成文件。
version: "2"
sql:
  - engine: "mysql"
    schema: "db/audit/schema/"
    queries: "db/audit/query/"
    gen:
      go:
        package: "auditdb"
        out: "pkg/auditdb"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
