syntax = "proto3";

package canvas;
option go_package = "./canvas";

// canvas：画布文档（Vue Flow 快照整段存）+ 单节点执行（node run）+ 模板 + 提示词库。
// 接口约定见 docs/api/api-canvas.md；设计见 docs/design/xiaoqi-2026-10-30/00-需求分流与设计方案.md §6。
// 快照、工具参数、Java 目录这类前端私有 / 透传 JSON 一律用 JSON 文本（string）承接，服务端只校验不翻译。
// 时间字段一律 unix 毫秒。
//
// 用户 Bearer 透传：网关把请求的 Authorization 原文放进 gRPC metadata「x-user-authorization」，
// 调 Java 兼容工具（放大 / 扩图 / 重绘）与 Java 价目接口时原样带上。
service Canvas {
  // ---- 画布 ----
  rpc ListCanvases(ListCanvasesReq) returns (ListCanvasesResp);
  rpc CreateCanvas(CreateCanvasReq) returns (CanvasDoc);
  // 取画布：快照 + revision，运行态按每个节点最近一次 run 回填进 data
  rpc GetCanvas(CanvasIdReq) returns (CanvasDoc);
  // 保存：if_match_revision 不符且非 force → conflict=true（网关转 4002，data 带服务端 revision）
  rpc SaveCanvas(SaveCanvasReq) returns (SaveCanvasResp);
  rpc DeleteCanvas(CanvasIdReq) returns (Empty);
  rpc SaveAsCanvas(SaveAsCanvasReq) returns (CanvasDoc);

  // ---- 执行 ----
  rpc RunNode(RunNodeReq) returns (RunNodeResp);
  rpc GetRun(RunIdReq) returns (RunResult);
  rpc CancelRun(RunIdReq) returns (RunResult);
  rpc ListRuns(ListRunsReq) returns (ListRunsResp);
  // 选中候选：写回 run.selected_index（GET 画布回填 selectedCandidate 以它为准）
  rpc SelectCandidate(SelectCandidateReq) returns (RunResult);
  // 重新存入素材库：成功 run 的产物转存永久失败（library_status=failed）时把转存任务重置为待转存并立即执行；
  // 仅本人；已在转存中 / 已在素材库时幂等返回当前状态；同一 run 每分钟至多重置一次。返回 run（library_status 变为 pending）
  rpc RetryLibraryCopy(RunIdReq) returns (RunResult);
  // 只增（2026-11-11）：成功 run 某个图片候选的来源（仅本人、未删除）：私有引用（mr:// / mrw://，转存素材库前 / 失败 / 免费档）给 rid，
  // 否则给长期地址。供区域蒙版（POST /api/v1/studio/masks 的 canvas_request_id + candidate_index）按归属精确取图，不下发给前端。
  rpc CandidateSource(CandidateSourceReq) returns (CandidateSourceResp);

  // ---- 目录 ----
  rpc Catalog(CatalogReq) returns (CatalogResp);
  // 只增（2026-11-19）：生图预估点数（只读，不冻结）。与 RunNode 冻结同一个 Quote（同一 Charge：模型组 + 尺寸 + 张数 + 画质 + 参考图数），
  // 契约 §AE：GPT Image 2.6 报「最多 X 点（按实际成本结算）」，其余按张固定价。
  rpc Estimate(EstimateReq) returns (EstimateResp);

  // ---- 模板 ----
  rpc ListTemplates(ListTemplatesReq) returns (ListTemplatesResp);
  rpc GetTemplate(TemplateIdReq) returns (TemplateInfo);
  rpc CreateTemplateFromCanvas(CreateTemplateFromCanvasReq) returns (TemplateInfo);
  rpc CreateCanvasFromTemplate(CreateCanvasFromTemplateReq) returns (CanvasDoc);
  rpc DeleteTemplate(TemplateIdReq) returns (Empty);

  // ---- 提示词库 ----
  rpc ListPrompts(ListPromptsReq) returns (ListPromptsResp);
  rpc CreatePrompt(UpsertPromptReq) returns (PromptItem);
  rpc UpdatePrompt(UpsertPromptReq) returns (PromptItem);
  rpc DeletePrompt(PromptIdReq) returns (Empty);

  // ---- 运营后台 ----
  rpc AdminListRuns(AdminListRunsReq) returns (AdminListRunsResp);
  rpc AdminForceFailRun(AdminRunReq) returns (Empty);
  rpc AdminListTemplates(AdminListTemplatesReq) returns (AdminListTemplatesResp);
  rpc AdminUpsertOfficialTemplate(AdminUpsertTemplateReq) returns (TemplateInfo);
  rpc AdminToggleTemplate(AdminToggleReq) returns (Empty);
  rpc AdminListPrompts(AdminListPromptsReq) returns (AdminListPromptsResp);
  rpc AdminUpsertOfficialPrompt(AdminUpsertPromptReq) returns (PromptItem);
  rpc AdminTogglePrompt(AdminToggleReq) returns (Empty);
  rpc AdminCostSummary(AdminCostSummaryReq) returns (AdminCostSummaryResp);

  // ---- 智能体工具（只增，2026-11-13）----
  // 执行一个画布智能体工具（清单见 app/canvas/agenttool；Function Call 与 MCP 两种形式都走这里）。
  // user_id 只来自网关鉴权；工具业务错误放在 is_error + result（{error_code,message,retryable}），不作 gRPC 错误返回。
  // 设计见 docs/design/canvas-agent-tools.md
  rpc AgentCall(AgentCallReq) returns (AgentCallResp);
  // 画布当前 revision（只读元数据，不读快照）：网关 SSE 归属校验 / 心跳对账 / 降级轮询
  rpc GetCanvasRevision(CanvasIdReq) returns (CanvasRevisionResp);

  // ---- MCP 访问令牌（只增，2026-11-14；Go_V1.0.42）----
  // 外部 MCP 客户端专用令牌：明文只在创建时返回一次，库里只存 sha256 + 前缀；每人最多 10 个生效中的令牌。
  // 管理（建 / 列 / 吊销）只接受登录令牌（网关校验）；校验由网关 Auth 前置调用（网关侧 Redis 缓存，吊销时网关删缓存）。
  rpc CreateMcpToken(CreateMcpTokenReq) returns (CreateMcpTokenResp);
  rpc ListMcpTokens(ListMcpTokensReq) returns (ListMcpTokensResp);
  rpc RevokeMcpToken(RevokeMcpTokenReq) returns (RevokeMcpTokenResp);
  // 按令牌哈希校验：不存在 / 已吊销 / 已过期 → Unauthorized（reason 区分）；成功时记最后使用时间与 IP
  rpc VerifyMcpToken(VerifyMcpTokenReq) returns (VerifyMcpTokenResp);
}

message Empty {}

// ---------------- 画布 ----------------

message CanvasSummary {
  string id = 1;
  string title = 2;
  string revision = 3;
  int32 node_count = 4;
  string cover_url = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message ListCanvasesReq {
  int64 user_id = 1;
  int32 page = 2;       // 从 1 起
  int32 page_size = 3;  // 默认 20，上限 50
}

message ListCanvasesResp {
  repeated CanvasSummary list = 1;
  int64 total = 2;
}

message CreateCanvasReq {
  int64 user_id = 1;
  int64 workspace_id = 2;
  string title = 3;     // 空=未命名画布
}

// 画布文档。snapshot 为 JSON 文本 {nodes,edges}（GetCanvas 已回填运行态）
message CanvasDoc {
  string id = 1;
  string title = 2;
  string revision = 3;
  string snapshot = 4;
  int32 node_count = 5;
  string cover_url = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message CanvasIdReq {
  int64 user_id = 1;
  string id = 2;
  // 仅 GetCanvas：取历史某个 revision 的快照（三方合并的 base）。空或等于当前 revision 时取最新；
  // 超出保留范围（每张画布只留最近 Limits.RevisionKeep 个）返回 4001 + reason CANVAS_REVISION_NOT_RETAINED。
  string revision = 3;
}

// 画布当前 revision（SSE 归属校验、心跳对账、无 Redis 时的轮询接口）。不读快照。
message CanvasRevisionResp {
  string revision = 1;
  int64 updated_at = 2;
  int32 node_count = 3;
}

message SaveCanvasReq {
  int64 user_id = 1;
  string id = 2;
  string snapshot = 3;           // JSON 文本 {nodes,edges}，≤2MB
  string if_match_revision = 4;  // 空且非 force：不带锁
  bool force = 5;
  bool has_title = 6;            // true 才改标题
  string title = 7;
}

message SaveCanvasResp {
  bool conflict = 1;             // true：版本冲突，未保存；revision / updated_at 为服务端当前值
  string revision = 2;
  int64 updated_at = 3;
  int32 node_count = 4;
  string cover_url = 5;
}

message SaveAsCanvasReq {
  int64 user_id = 1;
  string src_id = 2;
  string title = 3;
}

// ---------------- 执行 ----------------

message RunReference {
  string handle = 1;           // prompt / image / video / audio，及别名 first/last/image1/image2/garment/models/image-in
  int32 index = 2;             // 同 handle 内序号（连线 data.order），1 起
  string node_id = 3;
  string text = 4;
  string image = 5;
  string video = 6;
  string audio = 7;
  string asset_id = 8;
  string media_id = 9;
  string source_handle = 10;
  optional int32 candidate_index = 11;
  string mime = 12;
  int32 width = 13;            // 只增：参考图像素宽高（前端 / 素材库元数据，可选；按受理时服务端记录的上游候选尺寸优先）。只用于冻结估算，缺省按网关缩小后的上限
  int32 height = 14;
}

// RunNodeRequest 全字段（原型 RunNodeRequest 下划线化）
message RunNodeRequest {
  string model = 1;
  string model_id = 2;
  string kind = 3;             // image / video / tool（tool 时看 tool）；也接受 tool_crop 等完整写法
  string prompt = 4;
  repeated RunReference references = 5;
  string ratio = 6;
  string size = 7;
  string quality = 8;
  string duration = 9;
  bool sound = 10;
  int32 count = 11;
  double cfg = 12;
  string tool = 13;            // crop / upscale / outpaint / i2p / mask(inpaint) / tryon
  string tool_params = 14;     // JSON 文本（接口字段 params）
}

message RunNodeReq {
  int64 user_id = 1;
  string canvas_id = 2;
  string node_id = 3;
  string run_id = 4;           // = Idempotency-Key
  RunNodeRequest request = 5;
}

message RunNodeResp {
  string request_id = 1;
  string run_id = 2;
  string status = 3;
  bool replayed = 4;
  int64 credits = 5;
  repeated string warnings = 6; // 参数归一告警（如 Seedream 4K → 2K，按归一后的档位生成并计费）；没有为空
  string settle_mode = 7;       // 结算方式：FIXED 按冻结扣 / ACTUAL_COST 按供应商实际用量结算（credits 是最多扣多少）；未计费为空
  int64 max_points = 8;         // 本次最多扣多少点（= 冻结的 credits）
}

message Candidate {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
}

// RunNodeResult
message RunResult {
  string request_id = 1;
  string run_id = 2;
  string canvas_id = 3;
  string node_id = 4;
  string kind = 5;
  string status = 6;           // queued / running / succeeded / failed / cancelled
  int32 progress = 7;
  string model = 8;
  repeated Candidate candidates = 9;
  int32 selected_index = 10;
  string video_url = 11;
  string text = 12;            // tool_i2p 反推文本
  int64 credits = 13;
  int32 requested_count = 14;
  string error = 15;
  string error_code = 16;
  bool retryable = 17;
  int64 created_at = 18;
  int64 finished_at = 19;
  string task_id = 20;
  // 产物是否已进素材库（只增）：空=已在素材库或不适用；pending=已交付（地址是 10 分钟现签），后台转存素材库中；
  // failed=转存永久失败，产物仍可看可下载，但不在素材库
  string library_status = 21;
}

message RunIdReq {
  int64 user_id = 1;
  int64 id = 2;
}

message SelectCandidateReq {
  int64 user_id = 1;
  string canvas_id = 2;
  string node_id = 3;
  string run_id = 4;           // 该节点某次成功 run 的 run_id
  int32 index = 5;             // 候选下标（0 起）
}

message CandidateSourceReq {
  int64 user_id = 1;
  int64 id = 2;                          // run 主键（= RunResult.request_id）
  optional int32 candidate_index = 3;    // 候选下标（0 起）；不传 = 该 run 当前选中的候选（selected_index）
}

message CandidateSourceResp {
  string rid = 1;                        // 候选是私有引用时：媒体服务 rid（水印视图 mrw:// 同样给原件 rid，蒙版在原件上识别）
  string url = 2;                        // 候选不是私有引用时：长期地址（素材库公开地址）
  int32 index = 3;                       // 实际取的候选下标
}

message ListRunsReq {
  int64 user_id = 1;
  string canvas_id = 2;
  string node_id = 3;          // 空=全部节点
  int32 limit = 4;             // 默认 50，上限 200
}

message ListRunsResp {
  repeated RunResult list = 1;
}

// ---------------- 目录 ----------------

message CatalogReq {
  int64 user_id = 1;
}

message EstimateReq {
  int64 user_id = 1;
  string model = 2;        // 目录 model（Image / GPT Image 2.6 / Banana …，也认别名）
  string model_id = 3;     // 目录 model_id；与 model 二选一，model_id 优先
  string model_group = 4;  // 兜底：只给组码（img.gpt-image-2.6-sunburst）时按组找档
  string size = 5;         // 1K / 2K / 4K；空 = 模型首个档位
  int32 count = 6;         // 张数；<=0 按 1
  string quality = 7;      // low / medium / high；空 = 模型缺省（支持画质的为 high）；不支持画质的模型忽略
  int32 ref_images = 8;    // 参考图张数（影响 GPT Image 2.5 / 2.6 的最多点数；像素未知按网关缩小后的上限估）
  int32 prompt_chars = 15; // 提示词字符数（按 token 计价的模型用；缺省 0）
  repeated ImageSize ref_image_sizes = 16; // 每张参考图宽高（可选）；给了就以它的条数为参考图张数（与 ref_images 取大），按实际像素估
}

message ImageSize {
  int32 w = 1;
  int32 h = 2;
}

message EstimateResp {
  bool available = 1;      // false = 报不出价，reason 给用户看
  string reason = 2;
  int64 points = 3;        // 最多扣多少点（= 冻结点数）；计费关闭时 0
  int64 cap_points = 4;    // 同 points（ACTUAL_COST 时是冻结上限，前端显示「预计最多」用它）
  string settle_mode = 5;  // actual_cost / fixed
  string currency = 6;     // 恒 points
  string billing_mode = 7; // off / shadow / on
  string model_group = 8;
  string size = 9;
  string quality = 10;     // 实际参与计价的画质（模型不支持画质时为空）
  int32 count = 11;
  int32 ref_images = 12;
  int64 unit_points = 13;  // 每张点数（拆不均时 0）
  string note = 14;
}

message CatalogPrice {
  string size = 1;
  string duration = 2;
  int64 points = 3;
}

message CatalogModel {
  string model = 1;              // wire 值（前端 data.model：Image / Banana / SD5P / SD55 …）；展示用 label
  string model_id = 2;
  string kind = 3;               // image / video
  string badge = 4;
  string model_group = 5;        // gateway model group
  int32 max_image_refs = 6;      // 参考图上限：配置值与 gateway feature_limits.max_reference_images 取小
  repeated string ratios = 7;
  repeated string sizes = 8;
  repeated string qualities = 9;
  repeated string durations = 10;
  bool sound = 11;
  int32 count_max = 12;
  bool cap_quality = 13;
  bool cap_count = 14;
  bool cap_duration = 15;
  bool cap_sound = 16;
  repeated CatalogPrice prices = 17;
  bool ready = 18;               // gateway 模型组启用且存在
  int32 max_reference_videos = 19;
  string label = 20;             // 用户可见的完整模型名（GPT Image 2.5 / Nano Banana 2.1 …）；model 是 wire 值，不给用户看
}

message CatalogTool {
  string tool = 1;
  string label = 2;
  string billing = 3;            // free / java / gateway / studio
  repeated int32 scales = 4;     // upscale
  repeated string ratios = 5;    // outpaint
  bool ready = 6;
}

message CatalogResp {
  repeated CatalogModel image_models = 1;
  repeated CatalogModel video_models = 2;
  repeated CatalogTool tools = 3;
  string java_image_configs = 4; // Java /api/v1/features/image-model-configs 的 data 原文（JSON；取不到为空）
  string java_video_configs = 5;
}

// ---------------- 模板 ----------------

message TemplateInfo {
  int64 id = 1;
  string scope = 2;
  string title = 3;
  string description = 4;
  string cover_url = 5;
  int32 sort = 6;
  bool enabled = 7;
  string snapshot = 8;           // JSON 文本
  int32 node_count = 9;
  int32 edge_count = 10;
  int64 user_id = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message ListTemplatesReq {
  int64 user_id = 1;
  string scope = 2;              // official（默认）/ user / all
}

message ListTemplatesResp {
  repeated TemplateInfo list = 1;
}

message TemplateIdReq {
  int64 user_id = 1;
  int64 id = 2;
}

message CreateTemplateFromCanvasReq {
  int64 user_id = 1;
  string canvas_id = 2;
  string title = 3;
  string description = 4;
}

message CreateCanvasFromTemplateReq {
  int64 user_id = 1;
  int64 workspace_id = 2;
  int64 template_id = 3;
  string title = 4;
}

// ---------------- 提示词库 ----------------

message PromptItem {
  int64 id = 1;
  string title = 2;
  string prompt = 3;
  string vertical = 4;
  string group = 5;
  repeated string models = 6;
  repeated string tags = 7;
  string source = 8;
  string owner = 9;              // official / mine
  bool enabled = 10;
  int32 sort = 11;
  int64 user_id = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  string group_label = 15;       // 二级分类中文名
}

message ListPromptsReq {
  int64 user_id = 1;
  string vertical = 2;
  string group = 3;
  string model = 4;
  string q = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message PromptGroup {
  string vertical = 1;
  string key = 2;
  string label = 3;
  int64 count = 4;
}

message PromptCounts {
  int64 ecommerce = 1;
  int64 general = 2;
  int64 mine = 3;
  int64 official_total = 4;
  int64 mine_total = 5;
}

message ListPromptsResp {
  repeated PromptItem list = 1;
  int64 total = 2;
  repeated PromptGroup groups = 3;   // 各一级分类下的二级分类（有序，带中文名与条数）
  PromptCounts counts = 4;           // 当前用户可见的各域总数（不受筛选影响）
}

message UpsertPromptReq {
  int64 user_id = 1;
  int64 id = 2;                  // 更新时必填
  string title = 3;
  string prompt = 4;
  repeated string models = 5;
  repeated string tags = 6;
  string group = 7;              // 我的提示词二级分类：mine / favorite；空=新建默认 favorite、更新保持不变
}

message PromptIdReq {
  int64 user_id = 1;
  int64 id = 2;
}

// ---------------- 运营后台 ----------------

message AdminListRunsReq {
  int64 page = 1;
  int64 page_size = 2;
  int64 user_id = 3;
  string canvas_id = 4;
  string kind = 5;
  int32 status = 6;              // -1=全部
  string backend = 7;
  int64 start = 8;               // unix 毫秒，0=不限
  int64 end = 9;
}

message AdminRun {
  RunResult run = 1;
  int64 id = 2;
  int64 user_id = 3;
  string backend = 4;
  string backend_ref = 5;
  string model_group = 6;
  string billing_request_id = 7;
  string billing_status = 8;
  string cost_cny = 9;
  int32 attempt = 10;
  string request = 11;           // RunNodeRequest JSON
  int64 started_at = 12;
}

message AdminListRunsResp {
  repeated AdminRun list = 1;
  int64 total = 2;
}

message AdminRunReq {
  int64 id = 1;
  string reason = 2;
  int64 admin_id = 3;
}

message AdminListTemplatesReq {
  int64 page = 1;
  int64 page_size = 2;
  string scope = 3;              // 空=全部
  int32 enabled = 4;             // -1=全部
  string q = 5;
}

message AdminListTemplatesResp {
  repeated TemplateInfo list = 1;
  int64 total = 2;
}

message AdminUpsertTemplateReq {
  int64 id = 1;                  // 0=新增（官方）
  string title = 2;
  string description = 3;
  string snapshot = 4;
  string cover_url = 5;
  int32 sort = 6;
  bool enabled = 7;
}

message AdminToggleReq {
  int64 id = 1;
  bool enabled = 2;
}

message AdminListPromptsReq {
  int64 page = 1;
  int64 page_size = 2;
  string scope = 3;              // official（默认）/ user / all
  string vertical = 4;
  string group = 5;
  int32 enabled = 6;             // -1=全部
  string q = 7;
}

message AdminListPromptsResp {
  repeated PromptItem list = 1;
  int64 total = 2;
}

message AdminUpsertPromptReq {
  int64 id = 1;                  // 0=新增（官方）
  string title = 2;
  string prompt = 3;
  string vertical = 4;
  string group = 5;
  repeated string models = 6;
  repeated string tags = 7;
  string source = 8;
  int32 sort = 9;
  bool enabled = 10;
}

message AdminCostSummaryReq {
  int64 start = 1;
  int64 end = 2;
  string group_by = 3;           // kind（默认）/ model_group
}

message CostRow {
  string key = 1;
  int64 runs = 2;
  int64 succeeded = 3;
  int64 failed = 4;
  int64 canceled = 5;
  string cost_cny = 6;
  int64 points = 7;
}

message AdminCostSummaryResp {
  repeated CostRow rows = 1;
}

// ---------------- 智能体工具 ----------------

message AgentCallReq {
  int64 user_id = 1;
  string tool = 2;               // 工具名（canvas_get / canvas_add_nodes …）
  string arguments = 3;          // JSON 对象文本（按工具 inputSchema 校验）
  string call_id = 4;            // 幂等键（可空）：写 / 生成类工具同 key 同参数重放结果
  string client = 5;             // mcp / function / grpc（审计）
  string agent = 6;              // 客户端名（审计）
  string client_ip = 7;          // 调用方 IP（审计）
  // 只增（2026-11-14）：鉴权来源 user（登录令牌）| mcp_token（MCP 访问令牌）| svc（服务间 HMAC）；空按 user。
  // mcp_token 时 canvas-rpc 不借用用户 Bearer 缓存（需要 Java 令牌的操作回 MCP_TOKEN_JAVA_TOOL_UNSUPPORTED），并按 token_scope 二次校验生成类工具
  string auth_source = 8;
  string token_scope = 9;        // auth_source=mcp_token 时的作用域：canvas_rw | canvas_rw_generate
}

message AgentCallResp {
  string result = 1;             // JSON 对象文本：成功为工具出参；失败为 {error_code,message,retryable,...}
  bool is_error = 2;
  bool replayed = 3;             // 按 call_id 幂等重放
}

// ---------------- MCP 访问令牌 ----------------

message McpTokenInfo {
  int64 id = 1;
  string name = 2;
  string token_prefix = 3;       // 明文前若干位（mcp_xxxxxxxx），便于识别
  string scope = 4;              // canvas_rw | canvas_rw_generate
  int64 expires_at = 5;
  int64 last_used_at = 6;        // 0 = 从未使用
  string last_used_ip = 7;
  int64 created_at = 8;
  bool expired = 9;
}

message CreateMcpTokenReq {
  int64 user_id = 1;
  string name = 2;
  int32 expires_in_days = 3;     // 7 / 30 / 90
  string scope = 4;
  string client_ip = 5;
}

message CreateMcpTokenResp {
  McpTokenInfo token = 1;
  string plain_token = 2;        // 明文，只此一次
}

message ListMcpTokensReq {
  int64 user_id = 1;
}

message ListMcpTokensResp {
  repeated McpTokenInfo tokens = 1;  // 未吊销的（含已过期），新的在前
  int32 active_count = 2;            // 生效中（未过期）个数
  int32 max_active = 3;
}

message RevokeMcpTokenReq {
  int64 user_id = 1;
  int64 id = 2;
}

message RevokeMcpTokenResp {
  string token_hash = 1;         // 网关据此删校验缓存
}

message VerifyMcpTokenReq {
  string token_hash = 1;         // sha256(明文) 小写 hex；明文不出网关
  string client_ip = 2;
}

message VerifyMcpTokenResp {
  int64 token_id = 1;
  int64 user_id = 2;
  string scope = 3;
  int64 expires_at = 4;
}
