syntax = "proto3";

package studio;
option go_package = "./studio";

// studio：商拍换装（tryon）/ 姿态复刻（pose）/ 图片生成（imagegen）共用一条生图链路。
// 一次提交 = 一个批次（afv_studio_batch），服务端拆成每张图一个子任务（afv_studio_task）；
// 切图 / 反推走内部 sidecar，生图走 ai-gateway，结果经轮询器转存、结算、入素材库、同步任务中心。
// 时间字段一律 unix 毫秒。
service Studio {
  // ---- 用户侧 ----
  // 商拍换装整批提交：模特 × 每位张数，一张图一个子任务
  rpc SubmitTryon(SubmitTryonReq) returns (SubmitResp);
  // 姿态复刻整批提交：人物 1 张 + 姿势 1–9 张，一个姿势一个子任务
  rpc SubmitPose(SubmitPoseReq) returns (SubmitResp);
  // 图片生成：count 张，一张一个子任务
  rpc SubmitImageGen(SubmitImageGenReq) returns (SubmitResp);
  // 姿态多人配对预览（不计费、不建任务；原图读图结果按 用户+原图 sha1 写入 afv_studio_prompt_cache（batch_id=-user_id）供编排复用）：读原图与每张姿势图的人物（左→右），回人数与默认配对，
  // 供用户在付费提交前确认 / 反转配对；结果里的人数原样带回 SubmitPose 的 source_person_count / mappings[].pose_person_count
  rpc PreviewPose(PreviewPoseReq) returns (PreviewPoseResp);
  // 提交前报价（只读）：与提交同一套模型 / 分辨率归一与计费入口，返回本次提交会冻结的点数；不落库、不冻结、不校验素材
  rpc Quote(QuoteReq) returns (QuoteResp);
  // 模型档能力（只读）：每个模型档（通用 / GPT / GPT25 / Banana / Seedream）的展示名、实际可用的分辨率与比例、参考图上限；
  // 由 pipeline 的组规则（Seedream 5.5 无 4:5/5:4、旧 Seedream 无 4K、GPT 2.6 参考图硬上限）与 gateway 目录 feature_limits 求交得出。
  // with_price=true 时附每档分辨率的单张点数（与 Quote 同一计费入口，计费关时为 0）
  rpc Models(ModelsReq) returns (ModelsResp);
  // 批次详情 + 全部子任务（生成中轮询此接口）
  rpc GetBatch(GetBatchReq) returns (BatchDetail);
  // 单个子任务
  rpc GetTask(GetTaskReq) returns (TaskInfo);
  // 本链路历史（游标分页），含完整请求快照供回填
  rpc ListHistory(ListHistoryReq) returns (ListHistoryResp);
  // 取消批次：停止跟踪，未开始的子任务退款（gateway cancel 尽力而为）
  rpc CancelBatch(BatchUserReq) returns (CancelBatchResp);
  // 删除批次（软删）：进行中的批次拒绝删除
  rpc DeleteBatch(BatchUserReq) returns (Empty);
  // 用户重试单个失败子任务：只重跑该任务的生图一步（沿用已存的提示词 / 图序，不再反推），
  // 按原入口重新冻结 1 张的点数（新计费请求号 studio-<task_id>-r<n>，原单不再动）；返回批次详情（同 GetBatch）
  rpc RetryTask(RetryTaskReq) returns (BatchDetail);
  // 保存子任务的校色参数（仅本人、仅成功的任务）：前端浏览器里烘图，服务端只存五个滑杆值；返回该子任务
  rpc UpdateTaskColorFix(UpdateTaskColorFixReq) returns (TaskInfo);
  // 区域蒙版（局部校色，免费）：image_url 的 garment / product / person / background 区域 → 白色+软 alpha PNG（素材库桶公开地址）。
  // 按（去查询串的地址, 区域）缓存，重复请求直接返回；地址须为本存储签发或素材库域名。没识别到 → 4001「没识别到对应区域」
  rpc SegmentMask(SegmentMaskReq) returns (SegmentMaskResp);
  // 商拍「AI 找细节」（免费、不建任务）：对服装图跑 sidecar crop-plan，回每张图的细节框（归一化 [x,y,w,h]）与部位名，
  // 前端按框在原图上显示裁切缩略图，用户删减 / 重新裁切后把选中的框原样带回 SubmitTryon.detail_crops。
  // 限流同姿态配对预览：每用户同一时间一个、全进程共享读图名额
  rpc DetectDetails(DetectDetailsReq) returns (DetectDetailsResp);
  // 编辑提示词后重新生成单张（仅姿态复刻）：用用户改过的提示词重跑该子任务的生图一步（失败 / 成功的都可以），
  // 计费同用户重试（新计费请求号 studio-<task_id>-r<n>，冻结 1 张）；同一提示词重复提交幂等；返回批次详情（同 GetBatch）
  rpc RegenerateTask(RegenerateTaskReq) returns (BatchDetail);

  // ---- 运营后台 ----
  rpc AdminListBatches(AdminListBatchesReq) returns (AdminListBatchesResp);
  // 批次详情：含切图框、切图质检、组图、每步耗时与成本、每个子任务的完整 prompt
  rpc AdminGetBatch(AdminGetBatchReq) returns (AdminBatchDetail);
  // 运营重做失败的子任务：重新冻结点数、重新提交 gateway（attempt+1）
  rpc AdminRetryTask(AdminTaskReq) returns (Empty);
  // 运营强制失败：只收失败态子任务，置封禁重做；点数在失败时已退回，不动账
  rpc AdminForceFail(AdminTaskReq) returns (Empty);
  // 依赖健康：反推 sidecar / ai-gateway / 媒体服务
  rpc AdminSidecarStatus(Empty) returns (SidecarStatusResp);
  // 成本汇总（按类型或 model group）
  rpc AdminCostSummary(AdminCostSummaryReq) returns (AdminCostSummaryResp);
}

message Empty {}

// ---------------- 提交 ----------------

// 服装图
message GarmentImage {
  string url = 1;    // 图片地址，只收 http(s)；blob: / data: 一律拒绝
  string role = 2;   // 单品中文名（上衣 / 下装 / 连衣裙 …）或「整套」
  string angle = 3;  // 角度：front / back / side / detail / flat / unknown；空按 unknown
}

// 商拍换装（前端 s1.1 aiModelTryon 全量字段，改为整批一次提交）
message SubmitTryonReq {
  int64 user_id = 1;
  int64 workspace_id = 2;                // 工作空间；0=个人
  string request_id = 3;                 // 幂等键（Idempotency-Key），必填
  repeated string model_image_urls = 4;  // 模特图 1–9 张，每张一个模特
  repeated GarmentImage garment_images = 5; // 服装图 ≤9 张，每件单品 ≤6 张
  repeated string items = 6;             // 单品 1–3 件：top/bottom/dress/outer/shoes/accessory/bra/panties；互斥：裙↔上衣/下装、文胸↔上衣/裙、内裤↔下装/裙
  string set_mode = 7;                   // 成套方式：one / two（1 件也传）；空按 one
  map<string, string> lengths = 8;       // 单品长度 {item: 文本}，只认 items 里有的键
  map<string, string> sleeves = 9;       // 单品袖长 {item: 文本}，只认 items 里有的键
  string fabric = 10;                    // 面料，按件写：「上衣：真丝；鞋子：皮革」
  string prompt = 11;                    // 补充说明（→ sidecar notes），≤3000 字
  string model = 12;                     // 模型档：通用 / GPT / Banana / Seedream；空=通用
  string resolution = 13;                // 分辨率：1k / 2k / 4k（大小写不敏感，服务端归一为小写）；空=1k
  string aspect_ratio = 14;              // 比例，如 3:4；空=3:4
  int32 count_per_model = 15;            // 每位模特生成张数 1–9
  string cloth_image_url = 16;           // 旧版兼容位（首张服装图），新前端不要传；有 garment_images 时忽略
  bool color_fix = 17;                   // 「默认校色」开关：只记进批次 payload（color_fix=true），前端据此给结果套默认校色参数；不影响生图与计费
  bool fine_read = 18;                   // 「精细读图」：反推读图走 sidecar 精细模式（更慢、设计细节更多）；不另收费
  // 用户在「AI 找细节」里确认的细节框（DetectDetails 的结果，删减 / 重新裁切后）。detail_crops_manual=true 时编排直接按这些框切图、
  // 不再调 crop-plan / crop-check（为空 = 用户删光了，不用细节图）；false 时忽略 detail_crops，照旧自动找细节
  repeated DetailCrop detail_crops = 19;
  bool detail_crops_manual = 20;
}

// 一个细节框：garment_index 是 garment_images 的下标（从 0 起），box 为归一化 [x,y,w,h]（0–1，x+w≤1、y+h≤1）
message DetailCrop {
  int32 garment_index = 1;
  string label = 2;                      // 部位名，如「上衣·领口」（≤24 字）
  repeated double box = 3;
  double confidence = 4;                 // 识别置信度 0–1（用户手动保留的原样带回即可）
}

// 姿态复刻（前端 s1.1 aiPostureFission，改为整批一次提交）
message SubmitPoseReq {
  int64 user_id = 1;
  int64 workspace_id = 2;
  string request_id = 3;                 // 幂等键，必填
  string source_image_url = 4;           // 人物图（图 1），必填
  repeated string pose_image_urls = 5;   // 姿势图 1–9 张，每张一个子任务
  string global_prompt = 6;              // 全局补充说明，≤3000 字
  map<int32, string> pose_prompts = 7;   // 单张补充说明 {姿势下标(从 0 起): 文本}，≤3000 字
  string model = 8;                      // 模型档：通用 / GPT / Banana / Seedream；空=通用
  string resolution = 9;                 // 1k / 2k / 4k；空=1k
  string aspect_ratio = 10;              // 空=3:4
  // 多人配对（可选，来自 PreviewPose 的确认结果）：每张姿势图一条；不传的姿势图按默认配对（左→左、右→右）。
  // 只在原图 ≥2 人时有意义；传了 mappings 就必须带 source_person_count（预览时原图人数）
  int32 source_person_count = 11;
  repeated PoseMapping mappings = 12;
  bool color_fix = 13;                   // 「默认校色」开关，同 SubmitTryonReq.color_fix
}

// 一张姿势图的人物配对。mapping[i] = 原图第 i 位人物（左→右）学姿势图第几位人物（左→右，从 0 起）；-1 = 该人物保持原姿势。
// 校验：len(mapping) == source_person_count；值在 [-1, pose_person_count-1]；非负值不重复；至少一个非负值
message PoseMapping {
  int32 pose_index = 1;                  // 姿势图下标（从 0 起）
  repeated int32 mapping = 2;
  int32 pose_person_count = 3;           // 预览时该姿势图的人数
}

// 姿态配对预览
message PreviewPoseReq {
  int64 user_id = 1;
  string source_image_url = 2;           // 人物图（图 1），只收本服务签发的地址
  repeated string pose_image_urls = 3;   // 姿势图 1–9 张
}

// 预览里的一位人物（按画面左→右）
message PosePreviewPerson {
  string label = 1;                      // P1…P4
  string position = 2;                   // 画面左侧 / 画面中间 / 画面右侧 …
  bool primary = 3;                      // 主要人物（单人兼容字段取这位）
  string gender_age = 4;                 // 原图人物有；姿势图人物为空
  string summary = 5;                    // 原图：服装摘要；姿势图：动作剪影（outline）
}

message PosePreviewImage {
  int32 person_count = 1;
  repeated PosePreviewPerson people = 2;
  string group = 3;                      // 整组站位
  string interaction = 4;                // 身体接触；没有为「无」
  bool people_truncated = 5;             // 超过 4 人，只分析了前 4 位
}

message PosePreviewItem {
  int32 pose_index = 1;
  PosePreviewImage pose = 2;             // 失败时为空
  repeated int32 default_mapping = 3;    // sidecar 默认配对（长度 = 原图人数）；原图单人时为空（不需要配对）
  string error = 4;                      // 该姿势图分析失败的原因（不影响其它姿势图）；成功为空
}

message PreviewPoseResp {
  PosePreviewImage source = 1;
  repeated PosePreviewItem poses = 2;    // 顺序同 pose_image_urls；原图单人时也逐张读（只回人数 / 人物，供提示「多出的人物会被忽略」）
  bool mapping_enabled = 3;              // 原图 ≥2 人：前端显示配对 / 反转配对
}

// 图片生成（tool:image-generate）
message SubmitImageGenReq {
  int64 user_id = 1;
  int64 workspace_id = 2;
  string request_id = 3;                 // 幂等键，必填
  string prompt = 4;                     // 提示词，必填，≤3000 字
  repeated string image_urls = 5;        // 参考图 ≤9 张
  string model = 6;                      // 模型档：通用 / GPT / Banana / Seedream；空=通用
  string resolution = 7;                 // 1k / 2k / 4k；空=1k
  string aspect_ratio = 8;               // 空=1:1
  int32 count = 9;                       // 生成张数 1–9，一张一个子任务
  bool rewrite_prompt = 10;              // 先经 gateway chat.completion 润色一次提示词
}

message SubmitResp {
  int64 batch_id = 1;
  int32 task_total = 2;
  int64 estimated_points = 3;            // 预估消耗点数（单价 × 任务数）
  repeated string task_ids = 4;          // 子任务号，顺序同拆分顺序（模特→张数 / 姿势 / 张数）
  bool replayed = 5;                     // 幂等命中：同 request_id 已提交过，返回的是原批次
  repeated string warnings = 6;          // 参数归一告警（如 Seedream 不支持 4K、1K 只支持 1:1 → 按 2K 生成并计费）；幂等重放不回
}

// 提交前报价：kind + 影响价格的输入。task_total 由调用方按提交的拆任务规则算好
// （商拍 = 模特图数 × 每位张数；姿态 = 姿势图数；图片生成 = count）
message QuoteReq {
  int64 user_id = 1;
  string kind = 2;                       // tryon / pose / imagegen
  string model = 3;                      // 模型档：通用 / GPT / Banana / Seedream；空=通用
  string resolution = 4;                 // 1k / 2k / 4k；空=1k
  string aspect_ratio = 5;               // 空：商拍 / 姿态 = 自动，图片生成 = 1:1
  int32 task_total = 6;                  // 本次提交的任务（图片）数；0 = 还没传够素材，只回单价
}

message QuoteResp {
  bool available = 1;                    // 能否报出价；false 时 points / unit_points 为 0，原因见 reason
  int64 points = 2;                      // 本次提交预计冻结点数 = unit_points × task_total（与提交回的 estimated_points 同口径）
  int64 unit_points = 3;                 // 每张（每个任务）点数
  string price_unit = 4;                 // 计量单位：PER_IMAGE
  int32 task_total = 5;                  // 计价张数（回显请求）
  string resolution = 6;                 // 计价用分辨率（已按模型档归一，如 Seedream 4k → 2k）
  string billing_mode = 7;               // 计费开关：on 真扣 / shadow 只算价不扣 / off 不计费（点数为 0）
  bool charged = 8;                      // 提交是否真的会冻结扣点（仅 billing_mode=on）
  string reason = 9;                     // available=false 的原因（给用户看的短句）；可用时为空
  repeated string warnings = 10;         // 参数归一告警（同提交）
}

message ModelsReq {
  int64 user_id = 1;
  string kind = 2;                       // tryon / pose / imagegen；空=imagegen（影响参考图上限、是否有「自动」比例、报价入口）
  bool with_price = 3;                   // 是否附单张点数
}

message ModelResolutionPrice {
  string resolution = 1;                 // 1k / 2k / 4k
  bool available = 2;                    // 能否报出价
  int64 unit_points = 3;                 // 单张点数（billing_mode=off 时为 0）
}

message ModelCapability {
  string code = 1;                       // 传值：通用 / GPT / GPT25 / Banana / Seedream
  string label = 2;                      // 展示名（如 GPT Image 2.6）
  string model_group = 3;                // gateway model group
  bool available = 4;                    // gateway 目录里该组已启用；目录拉不到时按 true
  repeated string resolutions = 5;       // 可选分辨率（小写，1k / 2k / 4k 子集，按此顺序）
  repeated string aspect_ratios = 6;     // 可选比例（W:H，标准 10 档的子集，按标准顺序）
  bool auto_aspect = 7;                  // 是否支持「自动」比例（空串 = 按输入图取最近档；tryon / pose 为 true）
  int32 max_ref_images = 8;              // 本 kind 下的参考图上限
  repeated string notes = 9;             // 限制说明（给用户看的短句，如「Seedream 5.5 不支持 4:5 / 5:4」）
  repeated ModelResolutionPrice prices = 10;  // with_price 时有
}

message ModelsResp {
  string kind = 1;
  repeated ModelCapability items = 2;
  string billing_mode = 3;               // with_price 时有：on / shadow / off
}

// ---------------- 查询 ----------------

message GetBatchReq {
  int64 batch_id = 1;
  int64 user_id = 2;
  bool raw_refs = 3;                     // 仅内部调用方（canvas）：水印视图 mrw:// 原样返回，不签短期地址，由调用方自己持久化引用、读时再签
}

message GetTaskReq {
  string task_id = 1;
  int64 user_id = 2;
}

// 用户重试子任务
message RetryTaskReq {
  string task_id = 1;
  int64 user_id = 2;
}

// 校色五参数（整数，与前端滑杆一致）：色相 [-30,30]、饱和度 [-60,70]、明度 [-40,40]、亮度 [-80,80]、对比度 [-50,50]；全 0 = 不校色
message ColorFixParams {
  int32 hue = 1;
  int32 saturation = 2;
  int32 value = 3;                       // 明度
  int32 brightness = 4;                  // 亮度
  int32 contrast = 5;
}

message UpdateTaskColorFixReq {
  string task_id = 1;
  int64 user_id = 2;
  ColorFixParams params = 3;             // 必填
}

message SegmentMaskReq {
  int64 user_id = 1;
  string image_url = 2;                  // 必填：本存储签发 / 素材库域名的 http(s) 地址
  string target = 3;                     // garment 服装 / product 商品主体 / person 人物 / background 背景（主体之外）
  repeated string parts = 4;             // 仅 garment：细分部位 tops 上衣 / coat 外套 / pants 下装 / skirt 裙装 / shoes 鞋 / bag 包 / hat 帽；空=全部服装
}

// 一个部位的蒙版。
message MaskPart {
  string part = 1;                       // tops / coat / pants / skirt / shoes / bag / hat
  string mask_url = 2;                   // 白色 + 软 alpha 的 PNG，与原图同尺寸
}

message SegmentMaskResp {
  string mask_url = 1;                   // 白色 + 软 alpha 的 PNG（区域内不透明），与原图同尺寸；带 parts 时 = 这些部位的合并蒙版
  string target = 2;
  bool cached = 3;                       // 命中缓存（没有新的识别调用）
  repeated MaskPart parts = 4;           // 带 parts 时：逐件蒙版（固定部位顺序；图里没有的部位缺省）
  repeated string available_parts = 5;   // 该区域支持的细分部位（garment 才有）；空=不支持细分
}

// 「AI 找细节」：items / set_mode / garment_images 与 SubmitTryonReq 同口径（同一套校验）
message DetectDetailsReq {
  int64 user_id = 1;
  repeated string items = 2;
  string set_mode = 3;
  repeated GarmentImage garment_images = 4; // 只收本服务签发的地址
  string fabric = 5;
  string prompt = 6;                     // 补充说明（同提交，帮助模型找设计点）
}

message DetailPlan {
  int32 garment_index = 1;               // garment_images 下标
  string angle = 2;                      // 模型判断（或用户指定）的角度
  repeated DetailCrop crops = 3;         // 已校验（框合法、部位名带单品前缀、同图去重）
}

message DetectDetailsResp {
  repeated DetailPlan plans = 1;         // 顺序同 garment_images；没找到细节的图也有一项（crops 为空）
  int32 total = 2;                       // 细节框总数
  repeated string warnings = 3;          // 给用户看的提示（如部分图片没找到细节）
}

message RegenerateTaskReq {
  string task_id = 1;
  int64 user_id = 2;
  string prompt = 3;                     // 编辑后的提示词（必填，≤3000 字；可以带或不带首行「图序：」，服务端统一重写图序行）
}

message BatchUserReq {
  int64 batch_id = 1;
  int64 user_id = 2;
}

// 批次
message BatchInfo {
  int64 id = 1;
  string kind = 2;                       // tryon / pose / imagegen
  int32 status = 3;                      // 0-排队 1-切图中 2-反推中 3-生图中 4-全部成功 5-全部失败 6-部分成功 7-已取消 8-提交中
  string request_id = 4;
  string payload = 5;                    // 提交时的全量字段快照（JSON 文本），前端回填用
  int32 task_total = 6;
  int32 task_done = 7;
  int32 task_failed = 8;
  int64 estimated_points = 9;
  string error_reason = 10;
  string cover_url = 11;                 // 首张成功的成品，列表封面
  int64 created_at = 12;
  int64 updated_at = 13;
  repeated string warnings = 14;         // 读图 / 参考图提示（各子任务 warnings 去重合并，给用户看的中文，不含供应商信息）
}

// 子任务
message TaskInfo {
  int64 id = 1;
  string task_id = 2;
  int64 batch_id = 3;
  string kind = 4;
  int32 model_index = 5;                 // 商拍：第几位模特（从 0 起）
  int32 shot_index = 6;                  // 商拍 / 图片生成：第几张（从 0 起）
  int32 pose_index = 7;                  // 姿态：第几个姿势（从 0 起）
  int32 status = 8;                      // 0-排队 1-生成中 2-成功 3-失败 4-已取消 5-交付中
  int32 progress = 9;                    // 进度 0–100（按批次阶段 + 子任务状态估算，不是厂商真实进度）
  string result_url = 10;
  int32 result_width = 11;
  int32 result_height = 12;
  string error_reason = 13;
  string prompt_summary = 14;            // 提示词摘要（前 200 字，不含图序声明）
  string model_group = 15;               // 实际使用的 gateway model group
  int64 created_at = 16;
  int64 started_at = 17;                 // 0=未开始
  int64 finished_at = 18;                // 0=未结束
  ColorFixParams color_fix_params = 19;  // 已保存的校色参数；没保存过为空
  int64 asset_id = 20;                   // 成品入素材库后的 afv_asset.id（按 source_task_id 查，取未删除的最新一条）；没入库 / 已删除为 0。仅用户侧接口填
  string mask_url = 21;                  // 服装蒙版（白色+软 alpha PNG，公开地址）：商拍换装 / 姿态复刻成品成功后异步补；没有为空（校色作用于整图）
  repeated MaskPart mask_parts = 22;     // 商拍换装按所选单品分割时的逐件蒙版（mask_url 是它们的合并）；没有为空
  repeated string warnings = 23;         // 给用户看的提示：读图降级（「已改用文字信息生成」）、品类不符、参考图被截断等；不含供应商原文
  string prompt_text = 24;               // 实际送生图的完整提示词（含首行图序声明；姿态 / 商拍有，编排完成前为空）
  bool prompt_edited = 25;               // 提示词经用户编辑后重新生成过（RegenerateTask）
}

message BatchDetail {
  BatchInfo batch = 1;
  repeated TaskInfo tasks = 2;
}

message ListHistoryReq {
  int64 user_id = 1;
  string kind = 2;                       // 空=全部；tryon / pose / imagegen
  string cursor = 3;                     // 游标：上一页 next_cursor 原样回传（格式 <created_at 毫秒>_<id>）；空=第一页
  int32 limit = 4;                       // 每页条数，默认 20，上限 50
}

message ListHistoryResp {
  repeated BatchDetail items = 1;
  string next_cursor = 2;                // 空=没有下一页
}

message CancelBatchResp {
  BatchInfo batch = 1;
  int32 canceled_tasks = 2;              // 本次取消的子任务数（未开始的退款；已提交的尽力取消）
}

// ---------------- 运营后台 ----------------

// 时间范围（unix 毫秒，左闭右开；0=不限）
message DateRange {
  int64 start = 1;
  int64 end = 2;
}

message AdminListBatchesReq {
  int64 page = 1;                        // 从 1 起
  int64 page_size = 2;                   // 默认 20，上限 100
  int64 user_id = 3;                     // 0=不限
  string kind = 4;                       // 空=全部
  int32 status = 5;                      // -1=全部；同 BatchInfo.status
  DateRange date_range = 6;              // 按创建时间
}

message AdminBatch {
  BatchInfo batch = 1;
  int64 user_id = 2;
  int64 workspace_id = 3;
  string cost_cny = 4;                   // 子任务上游成本合计（人民币，DECIMAL 文本）
  string model_group = 5;                // 本批使用的 model group
}

message AdminListBatchesResp {
  repeated AdminBatch list = 1;
  int64 total = 2;
}

message AdminGetBatchReq {
  int64 batch_id = 1;
}

// 后台子任务：在用户侧字段之外带排查用的全部信息
message AdminTask {
  TaskInfo task = 1;
  string prompt_text = 2;                // 完整提示词
  string prompt_meta = 3;                // JSON 文本
  string input_images = 4;               // 实际送生图的图序（JSON 文本）
  string gateway_call_id = 5;
  string gateway_status = 6;
  int32 attempt = 7;                     // 第几次生成（运营重做 +1）
  bool admin_locked = 8;                 // 已强制失败，封禁重做
  string cost_cny = 9;
  string billing_request_id = 10;
  int32 billing_status = 11;             // 0-未计费 1-已冻结 2-已结算 3-已退回 4-影子模式
  int64 duration_ms = 12;                // finished_at - started_at
}

message AdminBatchDetail {
  AdminBatch batch = 1;
  string crop_plan = 2;                  // 切图方案（JSON 文本，框 0–1 归一化）
  string crop_check = 3;                 // 切图质检（JSON 文本）
  string selected_images = 4;            // 组图结果（JSON 文本）
  string step_log = 5;                   // 每步耗时与成本 [{step,ms,images,crops,degraded,cost_cny,at}]（JSON 文本）
  repeated AdminTask tasks = 6;
}

// 后台操作子任务：id（afv_studio_task 主键，来自 origin_ref 如 tyo:123）与 task_id 二选一，id 优先
message AdminTaskReq {
  int64 id = 1;
  string task_id = 2;
  int64 operator_id = 3;                 // 操作的管理员，记日志
}

message DependencyStatus {
  string name = 1;                       // sidecar / ai-gateway / media
  bool ok = 2;
  string base_url = 3;
  int64 latency_ms = 4;
  string version = 5;                    // 对方上报的版本（sidecar /api/status）
  string detail = 6;                     // 失败原因或附加信息
}

message SidecarStatusResp {
  repeated DependencyStatus deps = 1;
  int32 running_tasks = 2;               // 当前生成中的子任务数
  int32 queued_batches = 3;              // 排队 / 切图 / 反推中的批次数
}

message AdminCostSummaryReq {
  DateRange date_range = 1;              // 按子任务创建时间
  string group_by = 2;                   // kind / model_group；空=kind
}

message CostRow {
  string key = 1;                        // 分组值
  int32 task_total = 2;
  int32 task_succeeded = 3;
  int32 task_failed = 4;
  string cost_cny = 5;                   // DECIMAL 文本
  int64 points = 6;                      // 已结算点数（取预留单）
}

message AdminCostSummaryResp {
  repeated CostRow rows = 1;
  CostRow total = 2;
}
