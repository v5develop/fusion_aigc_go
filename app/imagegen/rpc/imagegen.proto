syntax = "proto3";

package imagegen;
option go_package = "./pb";

// AI 海报（78）、AI 长图（76）、动作迁移（9 / 86）、数字人口播（92 / 91）。流程相同，用 kind 区分。
service ImageGen {
  // ---- App ----
  // 提交前报价（只读，不冻结、不落库）
  rpc Quote(QuoteReq) returns (QuoteResp);
  // 表单配置：海报类型 / 风格 / 比例 / 数量与素材上限
  rpc Options(KindReq) returns (OptionsResp);
  // 模板列表（复用现有模板素材表，运营在现有后台维护）
  rpc ListTemplates(ListTemplatesReq) returns (TemplateList);
  // 提交生成（异步，轮询 Get）。一张图一个执行面任务。
  rpc Create(CreateReq) returns (CreationInfo);
  rpc Get(IdUserReq) returns (CreationInfo);
  rpc List(ListReq) returns (CreationList);
  rpc Delete(IdUserReq) returns (Empty);
  // ---- 动作迁移：动作视频（预置来自模板素材表，我的来自用户导入）----
  rpc ListActionVideos(IdUserReq) returns (ActionVideoList);
  rpc ImportActionVideo(ImportActionVideoReq) returns (ActionVideo);
  rpc DeleteActionVideo(IdUserReq) returns (Empty);

  // ---- 探店视频（72→73）/ 带货短剧（87→88）：两步，先出剧本再出片 ----
  rpc VideoOptions(KindReq) returns (VideoOptionsResp);
  // CreateVideo 提交表单，出剧本（72 / 87），轮询 GetVideo
  rpc CreateVideo(CreateVideoReq) returns (VideoInfo);
  rpc GetVideo(IdUserReq) returns (VideoInfo);
  // ReplanVideo 规划剧本页的「重新生成」
  rpc ReplanVideo(IdUserReq) returns (VideoInfo);
  // GenerateVideo 确认剧本，出成片（73 / 88 / 视频复刻 71）
  rpc GenerateVideo(GenerateVideoReq) returns (VideoInfo);
  rpc ListVideos(VideoListReq) returns (VideoList);
  rpc DeleteVideo(IdUserReq) returns (Empty);

  // ---- 运营后台 ----
  rpc AdminList(ListReq) returns (CreationList);
  rpc AdminListVideos(VideoListReq) returns (VideoList);
  // 运营取消在途图片 / 长图（预留原路退回）
  rpc AdminRetry(IdReq) returns (Empty);
  rpc AdminForceFail(IdReq) returns (Empty);
  // 运营取消在途视频（预留原路退回）
  rpc AdminRetryVideo(IdReq) returns (Empty);
  rpc AdminForceFailVideo(IdReq) returns (Empty);

  // 生成选项（模型 / 比例 / 时长）的运营配置：只能改启用、名称、排序、默认
  rpc AdminGenOptions(Empty) returns (GenOptionList);
  rpc AdminUpdateGenOption(UpdateGenOptionReq) returns (GenOptionItem);
  rpc AdminUpdateGenKind(UpdateGenKindReq) returns (GenKindItem);
}

message Empty {}

message GenOptionItem {
  int64 id = 1;
  string group = 2;
  string code = 3;
  string label = 4;
  int32 sort_order = 5;
  bool enabled = 6;
  bool is_default = 7;
}

message GenOptionList {
  repeated GenOptionItem list = 1;
  repeated GenKindItem kinds = 2;
}

message GenKindItem {
  string kind = 1;
  bool template_required = 2;
}

message UpdateGenKindReq {
  string kind = 1;
  bool template_required = 2;
}

message UpdateGenOptionReq {
  int64 id = 1;
  string label = 2;
  int32 sort_order = 3;
  bool enabled = 4;
  bool is_default = 5;
}

message IdUserReq {
  int64 id = 1;
  int64 user_id = 2;
}

message KindReq {
  string kind = 1;              // poster / longImage / actionTransfer / voiceover / exploreShop / shortDrama / videoRemake
}

message Option {
  string code = 1;
  string label = 2;
}

message ActionVideo {
  int64 id = 1;
  string name = 2;
  string url = 3;
  string cover_url = 4;
  bool mine = 5;                // true=用户导入的，可删除
}

message ActionVideoList {
  repeated ActionVideo presets = 1;  // 预置动作（模板素材表）
  repeated ActionVideo mine = 2;     // 我导入的
}

message ImportActionVideoReq {
  int64 user_id = 1;
  string url = 2;               // 直传后的视频地址
  string cover_url = 3;         // 选填
  string name = 4;              // 选填，默认「我的动作N」
}

message OptionsResp {
  repeated Option poster_types = 1;   // 海报类型（模板筛选维度 posterType），长图为空
  repeated Option poster_styles = 2;  // 海报风格，长图为空
  repeated Option sizes = 3;          // 图片比例；长图固定，只返回一项
  string default_size = 4;
  int32 max_images = 5;               // 生成数量上限
  int32 max_materials = 6;            // 上传素材上限
  int32 max_content_len = 7;          // 0 = 不限（数字人口播）
  bool template_required = 8;         // 海报模板必选；长图可不选（AI智能匹配）
  repeated Option models = 9;         // 动作迁移、数字人口播的模型选择；其余类型为空
  repeated int32 durations = 10;      // 数字人口播的视频时长（秒）；其余类型为空
  int32 default_duration = 11;
  string default_model = 12;
}

message ListTemplatesReq {
  string kind = 1;
  string poster_type = 2;       // 海报：按类型筛模板；空表示全部
}

message Template {
  int64 id = 1;
  string title = 2;
  string url = 3;
}

message TemplateList {
  repeated Template list = 1;
}

message CreateReq {
  int64 user_id = 1;
  string kind = 2;
  string content = 3;                 // 海报信息 / 长图内容
  repeated string material_urls = 4;  // 上传接口返回的地址
  int64 template_id = 5;              // 模板素材 id；长图可为 0（AI智能匹配）
  string poster_type = 6;
  string poster_style = 7;            // 空 = AI自动匹配
  string size = 8;                    // 不传用默认
  int32 image_count = 9;              // 不传为 1
  string request_id = 10;             // 幂等

  // ---- 动作迁移 ----
  string portrait_source = 11;        // UPLOAD / PUBLIC / AI（同数字人）
  string image_url = 12;              // UPLOAD：直传后的照片地址
  int64 public_id = 13;               // PUBLIC：公共数字人
  int64 portrait_id = 14;             // AI：定制形象记录
  int32 image_index = 15;             // AI：选中第几张
  int64 action_video_id = 16;         // 预置动作视频（模板素材 id）
  int64 my_action_video_id = 17;      // 我导入的动作视频 id
  string model = 18;                  // 模型：动作迁移 seedance 2.0 / lite；数字人口播 seedance2.5 / lite

  // ---- 数字人口播（文案用 content，比例用 size，人物图同动作迁移）----
  string background_source = 19;      // AI（智能匹配，默认）/ PRESET（预设背景）/ UPLOAD（导入背景）
  int64 background_id = 20;           // PRESET：预设背景（模板素材 id）
  string background_url = 21;         // UPLOAD：直传后的背景图地址
  int32 duration = 22;                // 15 / 30
  int64 copywriting_id = 23;  // 选填：内容来自哪条 AI文案（文案的生成历史用）
}

message CreationInfo {
  int64 id = 1;
  int64 user_id = 2;
  string kind = 3;
  string content = 4;
  repeated string material_urls = 5;
  int64 template_id = 6;
  string template_url = 7;
  string poster_type = 8;
  string poster_style = 9;
  string size = 10;
  int32 image_count = 11;
  repeated string image_urls = 12;
  string input_image_url = 16;
  string input_video_url = 17;
  string model = 18;
  string input_bg_url = 19;     // 数字人口播的背景图；空=AI智能匹配
  int32 duration = 20;          // 数字人口播的视频时长（秒）
  int32 status = 13;            // 0-生成中 1-已完成（含部分成功） 2-失败
  string fail_reason = 14;
  int64 create_time = 15;
  string media = 21;            // 成品媒体类型 image / video，由 kind 决定
}

message ListReq {
  int64 user_id = 1;
  string kind = 2;
  int32 status = 3;             // -1 表示全部
  int64 page = 4;
  int64 page_size = 5;
  string media = 6;             // image / video，空=不限；图片表里视频与图片混存，按 kind 归属
}

message CreationList {
  repeated CreationInfo list = 1;
  int64 total = 2;
}

// ---- 探店视频 / 带货短剧 ----

message VideoOptionsResp {
  repeated Option models = 1;      // seedance 2.5 / XQ Video 1.0 Lite
  string default_model = 2;
  repeated int32 durations = 3;    // 15 / 30
  int32 default_duration = 4;
  repeated Option sizes = 5;       // 9:16 / 16:9
  string default_size = 6;
  int32 max_user_text_len = 7;     // 探店：视频文案；短剧：短剧主题
  int32 max_selling_points_len = 8; // 短剧：商品卖点
  bool prop_required = 9;          // 短剧的商品图必填
  // 以下仅视频复刻（videoRemake）
  int64 max_video_bytes = 10;      // 源视频体积上限
  int32 max_video_seconds = 11;    // 源视频时长上限
  repeated string video_formats = 12; // 支持的视频格式
  bool link_enabled = 13;          // 「链接查视频」是否可用（链接解析未接入时为 false）
}

message CreateVideoReq {
  int64 user_id = 1;
  string kind = 2;                 // exploreShop / shortDrama
  string request_id = 3;
  string user_text = 4;            // 探店：视频文案；短剧：短剧主题
  string selling_points = 5;       // 短剧：商品卖点
  int64 shop_profile_id = 6;       // 选填：关联店铺档案

  // 出镜人物图：三种来源，同动作迁移 / 数字人口播
  string portrait_source = 7;      // UPLOAD / PUBLIC / AI；不选就不传人物图
  string image_url = 8;
  int64 public_id = 9;
  int64 portrait_id = 10;
  int32 image_index = 11;

  // 素材图（直传后的地址）：探店 门店图/店内图/道具图；短剧 环境图/商品图
  string env1_url = 12;
  string env2_url = 13;
  string prop_url = 14;

  int32 duration = 15;             // 15 / 30
  string size = 16;                // 9:16 / 16:9
  string model = 17;               // seedance2.5(默认) / lite

  // ---- 爆款视频复刻（videoRemake）----
  string source = 18;              // upload-上传本地视频 / link-粘贴链接
  string video_url = 19;           // upload：直传后的视频地址
  string link = 20;                // link：用户粘贴的分享链接
  int64 copywriting_id = 21;  // 选填：内容来自哪条 AI文案（文案的生成历史用）
}

// GenerateVideoReq 出片。视频复刻可以带上用户在剧情分析页改过的提示词、档位与比例；
// 探店 / 短剧只用 id + user_id（剧本在上一步已经定稿）。
message GenerateVideoReq {
  int64 id = 1;
  int64 user_id = 2;
  string prompt = 3;  // 视频复刻：改过的剧情文本，空则用解析出来的
  string model = 4;   // 视频复刻：模型，空则用默认
  string size = 5;    // 视频复刻：比例 9:16 / 16:9，空则跟原片
}

message VideoInfo {
  int64 id = 1;
  int64 user_id = 2;
  string kind = 3;
  string user_text = 4;
  string selling_points = 5;
  int64 shop_profile_id = 6;
  string char_url = 7;
  string env1_url = 8;
  string env2_url = 9;
  string prop_url = 10;
  int32 duration = 11;
  string size = 12;
  string model = 13;
  string script = 14;              // 剧本 JSON 原文（状态 1 起有值），前端解析后展示分幕
  string video_url = 15;
  int32 status = 16;
  // 以下仅视频复刻
  string source = 19;
  string source_url = 20;          // 用户粘贴的原始链接
  string source_video_url = 21;    // 待解析视频地址
  string title = 22;               // 原视频标题
  string cover_url = 23;           // 原视频封面               // 0-构思中 1-待确认 2-生成中 3-已完成 4-失败
  string fail_reason = 17;
  int64 create_time = 18;
}

message VideoListReq {
  int64 user_id = 1;
  string kind = 2;
  int32 status = 3;                // -1 表示全部
  int64 page = 4;
  int64 page_size = 5;
}

message VideoList {
  repeated VideoInfo list = 1;
  int64 total = 2;
}

message IdReq {
  int64 id = 1;
}

message QuoteReq {
  int64 user_id = 1;
  string kind = 2;        // poster / longImage / actionTransfer / voiceover / exploreShop / shortDrama / videoRemake
  string model = 3;
  int32 duration = 4;     // 口播 / 探店 / 短剧的视频时长（秒）
  int32 image_count = 5;  // 海报 / 长图张数
  int64 id = 6;           // 复刻：已解析的记录 id（有了才知道原片时长）
}

// 提交前报价（只读，不冻结）：用提交时同一个计费请求算价，返回本次会冻结的点数。见 pkg/billing/estimate.go
message QuoteResp {
  bool available = 1;      // 能否报出价；false 时 points 为 0，原因见 reason
  string reason = 2;
  string billing_mode = 3; // off / shadow / on
  bool charged = 4;        // 提交是否真的冻结点数（仅 on）
  int64 points = 5;        // 按这组参数算出的点数（exact=false 时为最低）
  int64 unit_points = 6;   // 单价：每张 / 每秒
  string price_unit = 7;   // PER_IMAGE / PER_SECOND / PER_REQUEST / PER_VIDEO
  int32 quantity = 8;      // 计量：张数或秒数
  bool exact = 9;          // points 是否就是冻结数；false = 要等提交后才知道计量（配音时长 / 原片时长）
  int64 points_max = 10;   // exact=false 时的最高点数（0 = 不知道）
  string stage = 11;       // 冻结发生在哪一步：submit 提交即冻结 / generate 构思免费、出片（出图）时冻结
  int64 balance = 12;      // 当前可用余额
  bool balance_known = 13;
  bool sufficient = 14;    // 余额是否够 points（charged=false 时恒为 true）
}
